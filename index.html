<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf6ed">
<title>Jessie 的小書櫃</title>

<style>
:root{
  --bg:#fbf6ed;
  --paper:#fffdf8;
  --text:#50392a;
  --muted:#9b8878;
  --pink:#eca2b3;
  --orange:#e99a5d;
  --green:#b8d1ae;
  --wood1:#d9a66f;
  --wood2:#bd7e45;
  --wood3:#87552f;
  --danger:#a34c4c;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
body{
  background:linear-gradient(#fffdf8,#fbf5ea);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
img{display:block}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:calc(22px + env(safe-area-inset-top)) 18px 12px;
}
h1{font-size:clamp(30px,8vw,42px);margin:0;font-weight:900}
.subtitle{color:var(--muted);margin-top:8px;font-size:17px}
.stats{
  display:inline-block;margin-top:14px;background:white;
  padding:8px 16px;border-radius:999px;
  box-shadow:0 5px 20px rgba(70,45,28,.08);
}

/* ===== TODAY ===== */
.today{
  width:calc(100% - 28px);max-width:650px;margin:8px auto 18px;
  background:white;border:2px solid #ecd5ba;border-radius:24px;padding:16px;
}
.today-head{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.today-total{background:#f3e9dd;padding:5px 10px;border-radius:999px;font-size:13px}
.today-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.today-row{
  width:100%;border:0;background:#fff9f2;border-radius:14px;
  display:flex;align-items:center;padding:10px;color:var(--text);text-align:left;
}
.today-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px}
.today-count{font-weight:900;background:#efe4d6;border-radius:999px;padding:4px 9px}
.empty{color:var(--muted);padding-top:10px;font-size:14px}

/* ===== HOME BOOKCASE ===== */
.home-title{
  width:calc(100% - 30px);max-width:650px;margin:25px auto 10px;
  display:flex;align-items:end;justify-content:space-between;
}
.home-title strong{font-size:21px}
.home-title button{
  border:0;background:transparent;color:#b17b54;font-weight:800;
}

.cabinet{
  width:calc(100% - 24px);max-width:650px;margin:auto;
  padding:20px 12px 28px;
  border:9px solid #9b673e;
  border-radius:25px 25px 15px 15px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.12),transparent 25%,rgba(74,39,19,.06)),
    #d7a16b;
  box-shadow:inset 0 0 25px rgba(78,44,23,.25),0 12px 30px rgba(73,45,28,.15);
}

.cabinet-section{margin-bottom:18px}
.cabinet-label{
  font-size:14px;font-weight:900;color:#6d452a;
  margin:0 4px 7px;
}

.spine-row{
  height:210px;
  display:flex;
  align-items:flex-end;
  overflow-x:auto;
  gap:2px;
  padding:10px 5px 0;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.spine-row::-webkit-scrollbar{display:none}

.spine{
  position:relative;
  flex:0 0 auto;
  border:0;
  padding:0;
  border-radius:4px 4px 1px 1px;
  color:#fff;
  box-shadow:
    inset 3px 0 5px rgba(255,255,255,.18),
    inset -3px 0 5px rgba(65,35,18,.15),
    2px 3px 4px rgba(62,37,20,.25);
  transform-origin:bottom;
  transition:transform .18s ease,filter .18s;
  overflow:hidden;
}
.spine:active{transform:translateY(-13px) scale(1.04)}
.spine::before{
  content:"";position:absolute;left:4px;right:4px;top:8px;
  height:2px;background:rgba(255,255,255,.3);
}
.spine::after{
  content:"";position:absolute;left:4px;right:4px;bottom:8px;
  height:2px;background:rgba(70,35,15,.15);
}

.spine-text{
  position:absolute;
  inset:17px 4px;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  overflow:hidden;
  font-size:12px;font-weight:900;
  line-height:1.1;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}

.shelf-board{
  height:20px;
  margin:0 -5px;
  border-bottom:6px solid #744524;
  background:linear-gradient(#e3b27d,#bd7d45);
  box-shadow:0 7px 8px rgba(69,40,21,.3);
}

/* ===== SEARCH / LIBRARY ===== */
#libraryView{display:none}
.search-area{width:calc(100% - 28px);max-width:650px;margin:0 auto 15px}
.search-wrap{position:relative}
#search{
  width:100%;height:52px;border:1.5px solid #e4d4c3;
  border-radius:18px;background:white;padding:0 45px;font-size:16px;outline:none;
}
.search-icon{position:absolute;left:15px;top:14px}
.filters{
  display:flex;overflow-x:auto;gap:8px;padding:10px 0 3px;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;border:1px solid #e4d4c3;background:white;
  border-radius:999px;padding:9px 14px;font-weight:800;color:#70594a;
}
.filter.active{background:var(--pink);color:white;border-color:var(--pink)}

.back-btn{
  border:0;background:white;border-radius:999px;padding:10px 15px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);font-weight:800;color:var(--text);
  margin-bottom:12px;
}

/* ===== COVER SHELVES ===== */
.category{margin:18px 0 27px}
.category-head{
  padding:0 18px 8px;display:flex;justify-content:space-between;align-items:end;
}
.category-head strong{font-size:19px}
.category-head span{font-size:12px;color:var(--muted)}

.cover-row{
  display:flex;align-items:flex-end;gap:16px;overflow-x:auto;
  padding:20px calc(50vw - 72px) 27px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.cover-row::-webkit-scrollbar{display:none}

.book-card{
  flex:0 0 144px;width:144px;border:0;background:transparent;
  padding:0;color:var(--text);scroll-snap-align:center;
  transform:scale(.88);opacity:.72;
  transition:.2s;transform-origin:center bottom;
}
.book-card.center{transform:scale(1.08) translateY(-4px);opacity:1}

.cover{
  width:144px;height:192px;border-radius:5px 10px 8px 4px;
  overflow:hidden;background:#e69b68;
  box-shadow:8px 13px 18px rgba(58,36,21,.24);
  position:relative;
}
.cover::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(90deg,rgba(40,20,10,.28),transparent);z-index:2;
}
.cover img{width:100%;height:100%;object-fit:cover}
.fake-cover{
  height:100%;padding:15px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;color:white;text-align:center;font-weight:900;
  background:linear-gradient(145deg,#efae79,#dc815e);
}
.fake-cover b{font-size:29px;margin-bottom:15px}
.book-caption{
  margin-top:12px;font-size:13px;font-weight:850;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.plank{
  height:23px;margin-top:-16px;
  background:linear-gradient(#e5b681,#bd7b43);
  border-bottom:6px solid #85502b;
  box-shadow:0 8px 10px rgba(62,37,20,.22);
}

/* ===== PARENT TOOLS ===== */
.parent-tools{
  display:none;width:calc(100% - 28px);max-width:650px;margin:15px auto;
  grid-template-columns:repeat(3,1fr);gap:8px;
}
body.parent .parent-tools{display:grid}
.parent-tools button{
  min-height:50px;border:0;background:white;border-radius:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.07);font-size:13px;font-weight:850;
}

/* ===== DIALOG ===== */
dialog{
  width:min(92vw,440px);max-height:92dvh;margin:auto;padding:0;
  border:4px solid #c89b68;border-radius:28px;background:var(--paper);
  color:var(--text);overflow:auto;box-shadow:0 25px 80px rgba(0,0,0,.4);
}
dialog::backdrop{background:rgba(56,46,38,.65);backdrop-filter:blur(4px)}
.modal{padding:18px}
.close{
  position:sticky;top:0;z-index:20;margin-left:auto;
  width:46px;height:46px;border:0;border-radius:50%;
  background:#f1e8dc;color:var(--text);font-size:24px;
}

.detail-cover{
  width:min(56vw,220px);aspect-ratio:3/4;margin:-25px auto 18px;
  border-radius:7px 14px 12px 5px;overflow:hidden;background:#e59a67;
  box-shadow:10px 15px 22px rgba(50,31,18,.25);
}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-title{text-align:center;font-size:25px;margin:10px 0}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tag{background:#f1e8de;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:800}

.read-numbers{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px;
}
.number{
  background:#f7f1e9;border-radius:17px;text-align:center;padding:11px;
}
.number strong{font-size:25px;display:block}
.number span{font-size:12px;color:var(--muted)}

.read-btn{
  width:100%;min-height:62px;border:0;border-radius:22px;margin-top:12px;
  background:linear-gradient(135deg,#efa05b,#dd805e);
  color:white;font-size:19px;font-weight:900;
}
.favorite{
  width:100%;min-height:52px;border:3px solid #c99d6b;
  border-radius:19px;background:white;color:var(--text);
  font-weight:900;font-size:16px;margin-top:9px;
}
.history-btn{
  width:100%;min-height:48px;border:0;background:#f2ece5;
  border-radius:16px;color:var(--text);font-weight:850;margin-top:9px;
}

.note{
  display:none;margin-top:15px;padding:14px;border:2px dashed #dda06e;
  border-radius:17px;background:#fff9f1;line-height:1.5;
}
body.parent .note{display:block}

.parent-actions{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
body.parent .parent-actions{display:grid}
.parent-actions button{min-height:48px;border:0;border-radius:15px;font-weight:900}
.edit{background:#eee;color:#555}
.delete{background:#ffe5e5;color:var(--danger)}

/* ===== HISTORY ===== */
.history-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.history-row{
  display:flex;align-items:center;gap:8px;background:#f8f3ed;
  padding:10px;border-radius:14px;
}
.history-time{flex:1;font-size:14px}
.history-delete{
  border:0;background:#ffe4e4;color:var(--danger);
  border-radius:10px;padding:7px 10px;font-weight:850;
}

/* ===== FORM ===== */
label{display:block;margin:12px 2px 5px;font-size:13px;font-weight:900}
input,select,textarea{
  width:100%;padding:13px;border:1px solid #ddd1c4;
  border-radius:13px;background:white;color:var(--text);font-size:16px;
}
textarea{min-height:90px;resize:vertical}
.preview{
  display:none;width:120px;height:160px;object-fit:cover;
  margin:12px auto;border-radius:7px;box-shadow:5px 8px 14px rgba(0,0,0,.18);
}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}
.form-actions button{height:49px;border:0;border-radius:14px;font-weight:900}
.cancel{background:#eee}
.save{background:var(--orange);color:white}

/* ===== BOTTOM ===== */
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  padding:22px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 35%);
  pointer-events:none;
}
#parentBtn{
  pointer-events:auto;border:0;background:white;border-radius:999px;
  min-height:52px;padding:0 22px;font-weight:900;color:var(--text);
  box-shadow:0 7px 22px rgba(0,0,0,.13);
}

/* ===== TOAST ===== */
.toast{
  position:fixed;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));
  transform:translate(-50%,40px);opacity:0;z-index:300;
  width:calc(100% - 28px);max-width:410px;
  background:#493d35;color:white;border-radius:18px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  pointer-events:none;transition:.2s;
}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:white;border-radius:999px;padding:7px 11px;font-weight:900}

@media(max-width:370px){
  .spine-row{height:190px}
}
</style>
</head>

<body>

<header>
  <h1>📚 Jessie 的小書櫃</h1>
  <div class="subtitle">今天想讀哪一本？</div>
  <div class="stats" id="stats"></div>
</header>

<section class="today">
  <div class="today-head">
    <span>☀️ 今天的共讀</span>
    <span class="today-total" id="todayTotal">0 次</span>
  </div>
  <div id="todayContent"></div>
</section>

<!-- 首頁：書脊 -->
<main id="homeView">
  <div class="home-title">
    <strong>🪵 Jessie 的書櫃</strong>
    <button id="openLibrary">看全部封面 →</button>
  </div>
  <div class="cabinet" id="cabinet"></div>
</main>

<!-- 全部書籍：封面 -->
<main id="libraryView">

  <section class="search-area">
    <button class="back-btn" id="backHome">← 回到書櫃</button>

    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="search" type="search" placeholder="搜尋書名...">
    </div>

    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="favorite">♡ 最愛</button>
      <button class="filter" data-filter="now">🌱 現在適合</button>
      <button class="filter" data-filter="later">🌿 長大再讀</button>
      <button class="filter" data-filter="story">故事</button>
      <button class="filter" data-filter="english">英文</button>
      <button class="filter" data-filter="sensory">互動</button>
      <button class="filter" data-filter="cognitive">認知</button>
      <button class="filter" data-filter="music">兒歌</button>
    </div>
  </section>

  <section class="parent-tools">
    <button id="addBook">＋ 新增書籍</button>
    <button id="exportBtn">⇩ 匯出備份</button>
    <button id="importBtn">⇧ 匯入備份</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </section>

  <div id="coverShelves"></div>
</main>

<div class="bottom">
  <button id="parentBtn">🔒 家長模式</button>
</div>

<!-- 書籍詳細 -->
<dialog id="detailDialog">
  <div class="modal">
    <button class="close" id="closeDetail">×</button>

    <div class="detail-cover" id="detailCover"></div>

    <h2 class="detail-title" id="detailTitle"></h2>

    <div class="tags">
      <span class="tag" id="detailCategory"></span>
      <span class="tag" id="detailAge"></span>
      <span class="tag" id="detailStatus"></span>
    </div>

    <!-- 共讀：不需家長模式 -->
    <div class="read-numbers">
      <div class="number">
        <strong id="todayBookReads">0</strong>
        <span>今天讀這本</span>
      </div>
      <div class="number">
        <strong id="totalBookReads">0</strong>
        <span>累積共讀</span>
      </div>
    </div>

    <button class="read-btn" id="readBtn">✓ 完成一次共讀</button>
    <button class="favorite" id="favoriteBtn">♡ 加入最愛</button>
    <button class="history-btn" id="historyBtn">🕘 管理共讀紀錄 ›</button>

    <div class="note">
      <strong>📝 媽媽的筆記</strong>
      <div id="detailNote" style="margin-top:5px"></div>
    </div>

    <div class="parent-actions">
      <button class="edit" id="editBtn">✏️ 編輯書籍</button>
      <button class="delete" id="deleteBtn">🗑 刪除書籍</button>
    </div>
  </div>
</dialog>

<!-- 共讀歷史 -->
<dialog id="historyDialog">
  <div class="modal">
    <button class="close" id="closeHistory">×</button>
    <h2>🕘 共讀紀錄</h2>
    <div id="historyTitle" style="color:var(--muted)"></div>
    <div class="history-list" id="historyList"></div>
  </div>
</dialog>

<!-- 新增 / 編輯 -->
<dialog id="editDialog">
  <form class="modal" id="bookForm">
    <h2 id="formTitle">新增書籍</h2>

    <label>書名 *</label>
    <input id="bookTitle" required>

    <label>📷 真實封面</label>
    <input id="bookCoverFile" type="file" accept="image/*">
    <img id="preview" class="preview">

    <label>分類</label>
    <select id="bookCategory">
      <option value="story">📕 故事繪本</option>
      <option value="english">🔤 英文繪本</option>
      <option value="sensory">✋ 感官互動</option>
      <option value="cognitive">🧠 認知</option>
      <option value="music">🎵 兒歌</option>
      <option value="other">📚 其他</option>
    </select>

    <label>適讀年齡</label>
    <input id="bookAge" placeholder="例如：0–1歲">

    <label>閱讀階段</label>
    <select id="bookStatus">
      <option value="now">🌱 現在適合</option>
      <option value="later">🌿 長大再讀</option>
    </select>

    <label>書脊顏色</label>
    <input id="spineColor" type="color" value="#d98b66">

    <label>📝 媽媽的筆記</label>
    <textarea id="bookNote"></textarea>

    <div class="form-actions">
      <button type="button" class="cancel" id="cancelEdit">取消</button>
      <button type="submit" class="save">儲存</button>
    </div>
  </form>
</dialog>

<!-- 共讀復原 -->
<div class="toast" id="toast">
  <span id="toastText">已記錄一次共讀</span>
  <button id="undoBtn">↩︎ 復原</button>
</div>

<script>
(()=>{
"use strict";

/* ===== 設定 ===== */
const STORAGE_KEY="jessie-bookshelf-v5";
const PIN="1234";

const names={
  story:"故事繪本",
  english:"英文繪本",
  sensory:"感官互動",
  cognitive:"認知",
  music:"兒歌",
  other:"其他"
};

const icons={
  story:"📕",
  english:"🔤",
  sensory:"✋",
  cognitive:"🧠",
  music:"🎵",
  other:"📚"
};

const colors=[
  "#c96f65","#d58a57","#b96c58","#78969a",
  "#81966e","#b6869b","#9b8066","#657e91",
  "#d29b56","#8f735f"
];

let books=[];
let selectedId=null;
let editingId=null;
let pendingCover="";
let filter="all";
let keyword="";
let lastRead=null;
let toastTimer;

/* ===== HELPERS ===== */
const $=id=>document.getElementById(id);

function id(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}

function dateKey(ts=Date.now()){
  const d=new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function formatTime(ts){
  if(!ts)return "舊版共讀紀錄";
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function bookById(bookId){return books.find(b=>b.id===bookId)}

function totalReads(book){return (book.readingHistory||[]).length}

function todayReads(book){
  const today=dateKey();
  return (book.readingHistory||[]).filter(r=>r.timestamp&&dateKey(r.timestamp)===today).length;
}

/* ===== STARTER ===== */
function starter(title,category,age,emoji,status="now"){
  return{
    id:id("book"),title,category,age,emoji,
    readingStatus:status,
    cover:"",
    note:"",
    favorite:false,
    spineColor:colors[Math.floor(Math.random()*colors.length)],
    readingHistory:[]
  };
}

function starterBooks(){
  return[
    starter("See, Touch, Feel","sensory","0–1歲","🙌"),
    starter("Brown Bear, Brown Bear, What Do You See?","english","0歲+","🐻"),
    starter("Dear Zoo","english","0歲+","🦁"),
    starter("小藍和小黃","story","1歲+","🔵"),
    starter("這是什麼聲音？交通","sensory","0歲+","🚗"),
    starter("找一找彩色襪子在哪裡？","cognitive","0歲+","🧦"),
    starter("找一找美味櫻桃在哪裡？","cognitive","0歲+","🍒"),
    starter("小黃點遊戲盒","other","3–6歲","🟡","later")
  ];
}

/* ===== STORAGE ===== */
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    books=raw?JSON.parse(raw):starterBooks();
    if(!Array.isArray(books))books=starterBooks();
  }catch{books=starterBooks()}

  books.forEach((b,i)=>{
    if(!b.id)b.id=id("book");
    if(!b.category)b.category="other";
    if(!b.readingStatus)b.readingStatus="now";
    if(typeof b.favorite!=="boolean")b.favorite=false;
    if(!b.spineColor)b.spineColor=colors[i%colors.length];
    if(!Array.isArray(b.readingHistory)){
      b.readingHistory=[];
      const old=Number(b.readCount)||0;
      for(let x=0;x<old;x++)b.readingHistory.push({id:id("legacy"),timestamp:null});
    }
    b.readingHistory.forEach(r=>{if(!r.id)r.id=id("read")});
  });

  save();
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(books));
    return true;
  }catch{
    alert("儲存空間不足。建議先匯出備份，並使用較小的封面照片。");
    return false;
  }
}

/* ===== STATS / TODAY ===== */
function renderStats(){
  const total=books.reduce((n,b)=>n+totalReads(b),0);
  $("stats").textContent=`${books.length} 本小書 · 累積共讀 ${total} 次`;
}

function renderToday(){
  const items=books.map(book=>({book,count:todayReads(book)})).filter(x=>x.count);
  const total=items.reduce((n,x)=>n+x.count,0);
  $("todayTotal").textContent=`${total} 次`;
  $("todayContent").innerHTML="";

  if(!items.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="今天還沒有共讀，讓 Jessie 選一本吧 ♡";
    $("todayContent").appendChild(e);
    return;
  }

  const list=document.createElement("div");
  list.className="today-list";

  items.forEach(({book,count})=>{
    const row=document.createElement("button");
    row.className="today-row";
    row.innerHTML=`<span>📖</span><span class="today-name"></span><span class="today-count">× ${count}</span>`;
    row.querySelector(".today-name").textContent=book.title;
    row.onclick=()=>openBook(book.id);
    list.appendChild(row);
  });

  $("todayContent").appendChild(list);
}

/* ===== SPINE HOME ===== */
function createSpine(book,index){
  const btn=document.createElement("button");
  btn.className="spine";

  const width=34+(index%4)*5;
  const height=145+(index%5)*9;

  btn.style.width=width+"px";
  btn.style.height=height+"px";
  btn.style.background=book.spineColor||colors[index%colors.length];

  const text=document.createElement("span");
  text.className="spine-text";
  text.textContent=book.title;
  btn.appendChild(text);

  btn.onclick=()=>openBook(book.id);
  return btn;
}

function cabinetSection(title,list){
  if(!list.length)return null;

  const wrap=document.createElement("section");
  wrap.className="cabinet-section";

  const label=document.createElement("div");
  label.className="cabinet-label";
  label.textContent=title;

  const row=document.createElement("div");
  row.className="spine-row";

  list.forEach((book,i)=>row.appendChild(createSpine(book,i)));

  const board=document.createElement("div");
  board.className="shelf-board";

  wrap.append(label,row,board);
  return wrap;
}

function renderCabinet(){
  $("cabinet").innerHTML="";

  const now=books.filter(b=>b.readingStatus!=="later");
  const later=books.filter(b=>b.readingStatus==="later");

  const a=cabinetSection("🌱 Jessie 現在的書",now);
  const b=cabinetSection("🌿 長大一點再讀",later);

  if(a)$("cabinet").appendChild(a);
  if(b)$("cabinet").appendChild(b);
}

/* ===== LIBRARY FILTER ===== */
function visible(book){
  if(keyword&&!book.title.toLowerCase().includes(keyword.toLowerCase()))return false;

  if(filter==="all")return true;
  if(filter==="favorite")return book.favorite;
  if(filter==="now")return book.readingStatus==="now";
  if(filter==="later")return book.readingStatus==="later";

  return book.category===filter;
}

function createCover(book){
  const btn=document.createElement("button");
  btn.className="book-card";

  const cover=document.createElement("div");
  cover.className="cover";

  if(book.cover){
    const img=document.createElement("img");
    img.src=book.cover;
    img.alt=book.title;
    cover.appendChild(img);
  }else{
    const fake=document.createElement("div");
    fake.className="fake-cover";
    const icon=document.createElement("b");
    icon.textContent=book.emoji||"📖";
    const title=document.createElement("span");
    title.textContent=book.title;
    fake.append(icon,title);
    cover.appendChild(fake);
  }

  const caption=document.createElement("div");
  caption.className="book-caption";
  caption.textContent=book.title;

  btn.append(cover,caption);
  btn.onclick=()=>openBook(book.id);

  return btn;
}

function centerRow(row){
  const update=()=>{
    const center=row.getBoundingClientRect().left+row.getBoundingClientRect().width/2;
    let best=null,distance=Infinity;

    row.querySelectorAll(".book-card").forEach(card=>{
      card.classList.remove("center");
      const r=card.getBoundingClientRect();
      const d=Math.abs((r.left+r.width/2)-center);
      if(d<distance){distance=d;best=card}
    });

    if(best)best.classList.add("center");
  };

  row.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});
  requestAnimationFrame(update);
}

function renderLibrary(){
  $("coverShelves").innerHTML="";
  const list=books.filter(visible);

  ["story","english","sensory","cognitive","music","other"].forEach(cat=>{
    const group=list.filter(b=>b.category===cat);
    if(!group.length)return;

    const section=document.createElement("section");
    section.className="category";

    const head=document.createElement("div");
    head.className="category-head";
    head.innerHTML=`<strong>${icons[cat]} ${names[cat]}</strong><span>${group.length} 本</span>`;

    const row=document.createElement("div");
    row.className="cover-row";
    group.forEach(book=>row.appendChild(createCover(book)));

    const plank=document.createElement("div");
    plank.className="plank";

    section.append(head,row,plank);
    $("coverShelves").appendChild(section);
    centerRow(row);
  });
}

/* ===== DETAIL ===== */
function renderDetail(book){
  $("detailCover").innerHTML="";

  if(book.cover){
    const img=document.createElement("img");
    img.src=book.cover;
    img.alt=book.title;
    $("detailCover").appendChild(img);
  }else{
    const fake=document.createElement("div");
    fake.className="fake-cover";
    fake.style.height="100%";
    fake.innerHTML=`<b>${book.emoji||"📖"}</b>`;
    const t=document.createElement("span");
    t.textContent=book.title;
    fake.appendChild(t);
    $("detailCover").appendChild(fake);
  }

  $("detailTitle").textContent=book.title;
  $("detailCategory").textContent=names[book.category]||"其他";
  $("detailAge").textContent=book.age||"不限";
  $("detailStatus").textContent=book.readingStatus==="later"?"🌿 長大再讀":"🌱 現在適合";
  $("todayBookReads").textContent=todayReads(book);
  $("totalBookReads").textContent=totalReads(book);
  $("favoriteBtn").textContent=book.favorite?"♥ Jessie 的最愛":"♡ 加入最愛";
  $("detailNote").textContent=book.note||"還沒有備註";
}

function openBook(bookId){
  const book=bookById(bookId);
  if(!book)return;
  selectedId=bookId;
  renderDetail(book);
  $("detailDialog").showModal();
}

/* ===== READING ===== */
$("readBtn").onclick=()=>{
  const book=bookById(selectedId);
  if(!book)return;

  const record={id:id("read"),timestamp:Date.now()};
  book.readingHistory.push(record);
  lastRead={bookId:book.id,recordId:record.id};

  save();
  renderAll();
  renderDetail(book);
  showToast("✓ 已記錄一次共讀",true);
};

$("undoBtn").onclick=()=>{
  if(!lastRead)return;

  const book=bookById(lastRead.bookId);
  if(book){
    book.readingHistory=book.readingHistory.filter(r=>r.id!==lastRead.recordId);
    save();
    renderAll();
    if(selectedId===book.id)renderDetail(book);
  }

  lastRead=null;
  hideToast();
};

$("favoriteBtn").onclick=()=>{
  const book=bookById(selectedId);
  if(!book)return;
  book.favorite=!book.favorite;
  save();renderAll();renderDetail(book);
};

/* ===== HISTORY — 不需家長模式 ===== */
$("historyBtn").onclick=()=>{
  const book=bookById(selectedId);
  if(!book)return;

  $("historyTitle").textContent=book.title;
  renderHistory(book);

  $("detailDialog").close();
  $("historyDialog").showModal();
};

function renderHistory(book){
  $("historyList").innerHTML="";

  const history=[...book.readingHistory].reverse();

  if(!history.length){
    $("historyList").innerHTML='<div class="empty">還沒有共讀紀錄。</div>';
    return;
  }

  history.forEach(record=>{
    const row=document.createElement("div");
    row.className="history-row";

    const time=document.createElement("div");
    time.className="history-time";
    time.textContent="📖 "+formatTime(record.timestamp);

    const del=document.createElement("button");
    del.className="history-delete";
    del.textContent="刪除";

    del.onclick=()=>{
      if(!confirm("確定刪除這一次共讀紀錄嗎？"))return;

      book.readingHistory=book.readingHistory.filter(r=>r.id!==record.id);
      save();
      renderAll();
      renderHistory(book);
    };

    row.append(time,del);
    $("historyList").appendChild(row);
  });
}

/* ===== PARENT ===== */
$("parentBtn").onclick=()=>{
  if(document.body.classList.contains("parent")){
    document.body.classList.remove("parent");
    $("parentBtn").textContent="🔒 家長模式";
    return;
  }

  const pin=prompt("請輸入家長 PIN");
  if(pin===null)return;

  if(pin!==PIN){
    alert("PIN 不正確");
    return;
  }

  document.body.classList.add("parent");
  $("parentBtn").textContent="🔓 離開家長模式";
};

/* ===== EDIT ===== */
function openForm(bookId=null){
  editingId=bookId;
  const book=bookId?bookById(bookId):null;

  $("formTitle").textContent=book?"編輯書籍":"新增書籍";
  $("bookTitle").value=book?.title||"";
  $("bookCategory").value=book?.category||"story";
  $("bookAge").value=book?.age||"";
  $("bookStatus").value=book?.readingStatus||"now";
  $("bookNote").value=book?.note||"";
  $("spineColor").value=book?.spineColor||colors[Math.floor(Math.random()*colors.length)];

  pendingCover=book?.cover||"";
  updatePreview();

  $("bookCoverFile").value="";
  $("editDialog").showModal();
}

$("addBook").onclick=()=>openForm();

$("editBtn").onclick=()=>{
  $("detailDialog").close();
  openForm(selectedId);
};

$("cancelEdit").onclick=()=>$("editDialog").close();

function updatePreview(){
  if(pendingCover){
    $("preview").src=pendingCover;
    $("preview").style.display="block";
  }else{
    $("preview").style.display="none";
  }
}

/* 壓縮照片 */
function compress(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      const img=new Image();

      img.onload=()=>{
        const scale=Math.min(1,650/img.width,900/img.height);
        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);

        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#fff";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        resolve(canvas.toDataURL("image/jpeg",.68));
      };

      img.onerror=reject;
      img.src=reader.result;
    };

    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

$("bookCoverFile").onchange=async function(){
  const file=this.files?.[0];
  if(!file)return;

  try{
    pendingCover=await compress(file);
    updatePreview();
  }catch{
    alert("照片讀取失敗");
  }
};

$("bookForm").onsubmit=e=>{
  e.preventDefault();

  const data={
    title:$("bookTitle").value.trim(),
    category:$("bookCategory").value,
    age:$("bookAge").value.trim()||"不限",
    readingStatus:$("bookStatus").value,
    note:$("bookNote").value.trim(),
    spineColor:$("spineColor").value,
    cover:pendingCover
  };

  if(editingId){
    Object.assign(bookById(editingId),data);
  }else{
    books.push({
      id:id("book"),
      ...data,
      favorite:false,
      readingHistory:[],
      emoji:"📖"
    });
  }

  if(save()){
    $("editDialog").close();
    renderAll();
  }
};

/* ===== DELETE BOOK ===== */
$("deleteBtn").onclick=()=>{
  const book=bookById(selectedId);
  if(!book)return;

  if(!confirm(`確定刪除《${book.title}》嗎？\n封面、筆記和共讀紀錄也會刪除。`))return;

  books=books.filter(b=>b.id!==book.id);
  selectedId=null;
  save();
  $("detailDialog").close();
  renderAll();
};

/* ===== EXPORT / IMPORT ===== */
$("exportBtn").onclick=()=>{
  const blob=new Blob(
    [JSON.stringify({version:7,books},null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="Jessie-bookshelf-backup.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("importBtn").onclick=()=>$("importFile").click();

$("importFile").onchange=function(){
  const file=this.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=Array.isArray(parsed)?parsed:parsed.books;

      if(!Array.isArray(incoming))throw Error();

      if(!confirm("匯入會取代目前書櫃，確定嗎？"))return;

      books=incoming;
      save();
      location.reload();
    }catch{
      alert("備份檔案格式不正確");
    }
  };

  reader.readAsText(file);
};

/* ===== NAV ===== */
$("openLibrary").onclick=()=>{
  $("homeView").style.display="none";
  $("libraryView").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
};

$("backHome").onclick=()=>{
  $("libraryView").style.display="none";
  $("homeView").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
};

$("search").oninput=e=>{
  keyword=e.target.value.trim();
  renderLibrary();
};

$("filters").onclick=e=>{
  const btn=e.target.closest(".filter");
  if(!btn)return;

  document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  filter=btn.dataset.filter;
  renderLibrary();
};

/* ===== CLOSE ===== */
$("closeDetail").onclick=()=>$("detailDialog").close();

$("closeHistory").onclick=()=>{
  $("historyDialog").close();

  const book=bookById(selectedId);
  if(book){
    renderDetail(book);
    $("detailDialog").showModal();
  }
};

/* ===== TOAST ===== */
function showToast(text,undo=false){
  clearTimeout(toastTimer);
  $("toastText").textContent=text;
  $("undoBtn").style.display=undo?"block":"none";
  $("toast").classList.add("show");

  toastTimer=setTimeout(hideToast,8000);
}

function hideToast(){
  $("toast").classList.remove("show");
}

/* ===== RENDER ===== */
function renderAll(){
  renderStats();
  renderToday();
  renderCabinet();
  renderLibrary();
}

load();
renderAll();

})();
</script>

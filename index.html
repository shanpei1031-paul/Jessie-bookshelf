<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9ED">

<title>潔心的小圖書館</title>

<style>
:root{
  --bg:#FFF9ED;
  --milk:#FFFCF6;
  --white:#FFFFFF;
  --oat:#F3E8D2;
  --butter:#F3DFA7;
  --sage:#AAB9A0;
  --peach:#E7BFA5;

  --brown:#51483F;
  --brown-soft:#74695F;
  --muted:#958B80;

  --line:#EAE0CF;
  --soft:#F7F0E4;
  --danger:#B96565;

  --book-shadow:
    3px 4px 0 rgba(224,214,199,.85),
    7px 10px 18px rgba(73,57,42,.12);
}


/* ==============================
   BASE
============================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  overflow-x:hidden;
}

html{
  background:var(--bg);
}

body{
  min-height:100vh;

  padding-bottom:
    calc(100px + env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(243,223,167,.18),
      transparent 28%
    ),
    var(--bg);

  color:var(--brown);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
  -webkit-appearance:none;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

img{
  display:block;
}

.app{
  width:min(100%,900px);
  margin:auto;
}


/* ==============================
   HEADER
============================== */

header{
  padding:
    calc(28px + env(safe-area-inset-top))
    20px
    14px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.title-wrap{
  min-width:0;
}

h1{
  margin:0;

  color:var(--brown);

  font-size:30px;
  line-height:1.15;
  letter-spacing:-1px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;

  color:var(--muted);

  font-size:13px;
  line-height:1.4;
}

.stats{
  flex:0 0 auto;

  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:999px;

  background:rgba(255,252,246,.9);

  color:var(--brown-soft);

  font-size:11px;
  font-weight:800;
}


/* ==============================
   SEARCH
============================== */

.search-wrap{
  padding:0 20px 16px;
}

.search{
  position:relative;
}

.search-icon{
  position:absolute;

  left:16px;
  top:50%;

  transform:translateY(-50%);

  color:#B3A89D;

  font-size:18px;

  pointer-events:none;
}

.search input{
  width:100%;
  height:50px;

  padding:0 42px;

  border:1px solid var(--line);
  border-radius:18px;

  outline:none;

  background:rgba(255,252,246,.95);

  color:var(--brown);

  font-size:15px;
}

.search input::placeholder{
  color:#B0A69C;
}

.search input:focus{
  border-color:#D7C7AF;

  box-shadow:
    0 0 0 3px rgba(243,223,167,.2);
}


/* ==============================
   TODAY
============================== */

.today{
  margin:0 20px 22px;

  padding:16px;

  border:1px solid var(--line);
  border-radius:22px;

  background:rgba(255,252,246,.92);

  box-shadow:
    0 5px 18px rgba(78,61,44,.035);
}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-heading h2{
  margin:0;

  font-size:17px;
  font-weight:900;
}

.section-count{
  color:var(--muted);

  font-size:12px;
}

.today-empty{
  margin-top:10px;

  color:var(--muted);

  font-size:13px;
}

.today-books{
  display:flex;
  gap:13px;

  margin-top:14px;

  overflow-x:auto;

  scrollbar-width:none;

  padding-bottom:3px;
}

.today-books::-webkit-scrollbar{
  display:none;
}

.today-book{
  flex:0 0 78px;

  padding:0;

  border:0;

  background:transparent;

  color:var(--brown);

  text-align:left;
}

.today-cover{
  width:78px;
  height:100px;

  padding:3px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:7px;

  background:#F7F2E9;

  box-shadow:
    2px 3px 0 #E9E1D6,
    4px 6px 10px rgba(65,50,38,.10);
}

.today-cover img{
  width:auto;
  height:auto;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  border-radius:5px;

  background:#fff;
}

.today-title{
  margin-top:7px;

  overflow:hidden;

  color:var(--brown);

  font-size:11px;
  font-weight:750;
  line-height:1.35;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.today-read-count{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}


/* ==============================
   FILTERS
============================== */

.filters{
  display:flex;
  gap:8px;

  padding:0 20px 20px;

  overflow-x:auto;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  min-height:38px;

  padding:0 15px;

  border:1px solid var(--line);
  border-radius:999px;

  background:rgba(255,252,246,.94);

  color:var(--brown-soft);

  font-size:12px;
  font-weight:850;

  transition:
    transform .12s ease,
    background .12s ease;
}

.filter:active{
  transform:scale(.96);
}

.filter.active{
  border-color:#75695F;

  background:#75695F;

  color:#FFFDF8;

  box-shadow:
    0 4px 10px rgba(70,55,43,.10);
}


/* ==============================
   LIBRARY
============================== */

.library{
  padding:0 20px;
}

.library-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:17px;
}

.library-heading h2{
  margin:0;

  color:var(--brown);

  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.library-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
}

.result-count{
  flex:0 0 auto;

  color:var(--muted);

  font-size:11px;
}

.sort-select{
  width:auto;
  max-width:120px;

  padding:
    7px 27px
    7px 10px;

  border:1px solid var(--line);
  border-radius:999px;

  background:
    linear-gradient(
      45deg,
      transparent 50%,
      #8B8177 50%
    )
    calc(100% - 13px)
    50% / 5px 5px
    no-repeat,

    linear-gradient(
      135deg,
      #8B8177 50%,
      transparent 50%
    )
    calc(100% - 9px)
    50% / 5px 5px
    no-repeat,

    rgba(255,252,246,.95);

  color:var(--brown-soft);

  font-size:11px;
  font-weight:800;

  outline:none;
}


/* ==============================
   BOOK GRID
============================== */

.book-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:
    30px 17px;
}

.book-card{
  min-width:0;

  padding:0;

  border:0;

  background:transparent;

  color:var(--brown);

  text-align:left;
}


/* ==============================
   SMART BOOK COVER

   外層維持整齊
   書本本身保留原始比例
============================== */

.cover{
  position:relative;

  width:100%;

  aspect-ratio:3 / 4;

  padding:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:visible;

  border-radius:8px;

  background:#F8F4ED;

  box-shadow:
    var(--book-shadow);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.cover > img{
  position:relative;
  z-index:1;

  width:auto;
  height:auto;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  border-radius:7px;

  background:#fff;

  box-shadow:
    0 4px 12px rgba(63,49,38,.07);
}

.cover::before{
  content:"";

  position:absolute;

  z-index:2;

  top:8px;
  bottom:8px;
  left:8px;

  width:4px;

  border-radius:
    6px 0 0 6px;

  background:
    linear-gradient(
      90deg,
      rgba(59,45,35,.08),
      rgba(255,255,255,.01)
    );

  pointer-events:none;
}

.cover::after{
  content:"";

  position:absolute;

  z-index:-1;

  left:5px;
  right:-4px;

  top:5px;
  bottom:-5px;

  border-radius:8px;

  background:#EEE7DB;

  box-shadow:
    3px 4px 8px
    rgba(62,47,36,.07);

  pointer-events:none;
}

.book-card:active .cover{
  transform:
    translateY(2px)
    scale(.985);

  box-shadow:
    2px 3px 0 rgba(224,214,199,.85),
    4px 6px 10px rgba(73,57,42,.10);
}

.cover-placeholder{
  position:relative;

  z-index:1;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:18px;

  border-radius:7px;

  background:
    linear-gradient(
      145deg,
      #F8EEDB,
      #F2E4CA
    );

  color:#8B7968;

  text-align:center;
}

.cover-placeholder span{
  margin-bottom:9px;

  font-size:26px;
}

.favorite{
  position:absolute;

  z-index:5;

  top:8px;
  right:8px;

  display:grid;
  place-items:center;

  width:30px;
  height:30px;

  border:1px solid rgba(234,224,207,.75);

  border-radius:50%;

  background:rgba(255,252,246,.94);

  color:#C38D7C;

  box-shadow:
    0 2px 7px rgba(60,45,35,.08);

  font-size:14px;
}


/* ==============================
   BOOK INFO
============================== */

.book-title{
  margin-top:12px;

  overflow:hidden;

  color:var(--brown);

  font-size:14px;
  font-weight:900;
  line-height:1.4;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.book-info{
  display:flex;
  flex-wrap:wrap;
  gap:5px;

  margin-top:7px;
}

.tag{
  padding:4px 8px;

  border-radius:999px;

  background:var(--soft);

  color:#85796D;

  font-size:10px;
  font-weight:750;
}

.no-results{
  grid-column:1/-1;

  padding:
    55px 20px;

  color:var(--muted);

  text-align:center;
}


/* ==============================
   DIALOG
============================== */

dialog{
  width:min(94vw,450px);

  max-height:92dvh;

  margin:auto;
  padding:0;

  overflow:auto;

  border:1px solid rgba(234,224,207,.8);

  border-radius:28px;

  background:var(--milk);

  color:var(--brown);

  box-shadow:
    0 28px 90px rgba(55,43,34,.25);
}

dialog::backdrop{
  background:
    rgba(57,48,41,.50);

  backdrop-filter:
    blur(4px);
}

.modal{
  padding:18px;
}

.close{
  position:sticky;

  top:0;

  z-index:30;

  display:grid;
  place-items:center;

  width:43px;
  height:43px;

  margin-left:auto;

  border:1px solid var(--line);

  border-radius:50%;

  background:#F8F1E6;

  color:var(--brown-soft);

  font-size:23px;
}


/* ==============================
   DETAIL
============================== */

.detail-photo-wrap{
  min-height:285px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    0 20px 15px;
}

.detail-fallback{
  position:relative;

  width:min(78vw,250px);
  height:300px;

  padding:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#F7F3EC;

  box-shadow:
    3px 4px 0 #E7DED2,
    8px 13px 25px rgba(55,42,31,.15);
}

.detail-fallback img{
  width:auto;
  height:auto;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  border-radius:7px;

  background:#fff;
}

.detail-title{
  margin:
    7px 7px 13px;

  color:var(--brown);

  font-size:24px;
  line-height:1.3;

  text-align:center;
}

.detail-tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:7px;
}

.detail-tag{
  padding:
    7px 11px;

  border-radius:999px;

  background:#F4EBDD;

  color:#75695E;

  font-size:12px;
  font-weight:800;
}

.detail-tag.now{
  background:#E8EEE3;

  color:#66735F;
}


/* ==============================
   READ STATS
============================== */

.read-stats{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:18px;
}

.read-stat{
  padding:12px;

  border:1px solid #EFE5D6;

  border-radius:18px;

  background:#FBF5EA;

  text-align:center;
}

.read-stat strong{
  display:block;

  color:var(--brown);

  font-size:23px;
}

.read-stat span{
  color:var(--muted);

  font-size:11px;
}


/* ==============================
   READ BUTTON
============================== */

.read-btn{
  width:100%;

  min-height:59px;

  margin-top:11px;

  border:0;

  border-radius:19px;

  background:#75695F;

  color:#FFFDF8;

  font-size:16px;
  font-weight:900;

  box-shadow:
    0 5px 13px rgba(69,53,41,.10);
}

.read-btn:active{
  transform:scale(.985);
}

.read-btn.done{
  background:#87967F;
}


/* ==============================
   DETAIL ACTIONS
============================== */

.detail-actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:9px;
}

.detail-actions button{
  min-height:47px;

  border:1px solid var(--line);

  border-radius:16px;

  background:#FFFDF9;

  color:#74695F;

  font-size:12px;
  font-weight:850;
}


/* ==============================
   NOTE
============================== */

.note{
  display:none;

  margin-top:15px;

  padding:15px;

  border:1px solid #EFE5D6;

  border-radius:18px;

  background:#FBF5EA;

  color:#6F655C;

  line-height:1.6;

  font-size:13px;
}

body.parent .note{
  display:block;
}


/* ==============================
   PARENT ACTIONS
============================== */

.parent-actions{
  display:none;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:9px;
}

body.parent .parent-actions{
  display:grid;
}

.parent-actions button{
  min-height:47px;

  border:0;

  border-radius:16px;

  font-weight:850;
}

.edit-btn{
  background:#EFE6D8;

  color:#6F6459;
}

.delete-btn{
  background:#F6E2DE;

  color:var(--danger);
}


/* ==============================
   HISTORY
============================== */

.history-list{
  display:flex;
  flex-direction:column;

  gap:8px;

  margin-top:14px;
}

.history-row{
  display:flex;
  align-items:center;

  gap:8px;

  padding:12px;

  border:1px solid #EFE5D6;

  border-radius:14px;

  background:#FBF5EA;
}

.history-time{
  flex:1;

  font-size:13px;
}

.history-delete{
  display:none;

  padding:
    6px 10px;

  border:0;

  border-radius:10px;

  background:#F3DCD8;

  color:var(--danger);

  font-size:11px;
  font-weight:850;
}

body.parent .history-delete{
  display:block;
}


/* ==============================
   FORM
============================== */

.form-title{
  margin:0;

  font-size:23px;
}

label{
  display:block;

  margin:
    13px 2px 6px;

  color:#665C53;

  font-size:12px;
  font-weight:850;
}

input,
select,
textarea{
  width:100%;

  padding:12px;

  border:1px solid #E4D9CA;

  border-radius:13px;

  outline:none;

  background:#FFFDF9;

  color:var(--brown);

  font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#D2BEA3;

  box-shadow:
    0 0 0 3px
    rgba(243,223,167,.18);
}

textarea{
  min-height:95px;

  resize:vertical;
}

.form-help{
  margin-top:6px;

  color:var(--muted);

  font-size:11px;
  line-height:1.5;
}

.upload-preview{
  display:none;

  max-width:160px;
  max-height:190px;

  margin:
    12px auto;

  object-fit:contain;

  border-radius:8px;
}


/* ==============================
   EDIT HEADER
============================== */

.edit-modal{
  padding-top:0;
}

.edit-header{
  position:sticky;

  top:0;

  z-index:40;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin:
    0 -18px 8px;

  padding:
    14px 18px 10px;

  background:
    rgba(255,252,246,.97);

  border-bottom:
    1px solid rgba(234,224,207,.75);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}

.edit-close{
  position:static;

  flex:0 0 auto;

  margin:0;
}


/* ==============================
   COVER SEARCH
============================== */

.cover-search-btn{
  width:100%;

  min-height:46px;

  margin-bottom:9px;

  border:1px solid var(--line);

  border-radius:14px;

  background:#F4EBDD;

  color:#70655B;

  font-size:12px;
  font-weight:850;
}

.cover-results{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:9px;
}

.cover-choice{
  padding:4px;

  overflow:hidden;

  border:2px solid transparent;

  border-radius:9px;

  background:#F3EBDD;
}

.cover-choice.selected{
  border-color:#A89580;
}

.cover-choice img{
  width:100%;

  aspect-ratio:3 / 4;

  object-fit:contain;

  background:#fff;

  border-radius:5px;
}

.search-message{
  margin-top:7px;

  color:var(--muted);

  font-size:11px;
}


/* ==============================
   STICKY FORM ACTIONS
============================== */

.form-actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:19px;
}

.form-actions.sticky-actions{
  position:sticky;

  z-index:35;

  bottom:-18px;

  margin:
    20px -18px -18px;

  padding:
    12px 18px
    calc(18px + env(safe-area-inset-bottom));

  background:
    rgba(255,252,246,.97);

  border-top:
    1px solid rgba(234,224,207,.75);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}

.form-actions button{
  min-height:49px;

  border:0;

  border-radius:15px;

  font-weight:900;
}

.cancel{
  background:#F0E7D9;

  color:#756A60;
}

.save{
  background:#75695F;

  color:#FFFDF8;
}


/* ==============================
   PARENT TOOLS
============================== */

.parent-tools{
  display:none;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  padding:
    25px 20px 0;
}

body.parent .parent-tools{
  display:grid;
}

.parent-tools button{
  min-height:46px;

  padding:8px;

  border:1px solid var(--line);

  border-radius:14px;

  background:#FFFDF8;

  color:#6F645A;

  font-size:11px;
  font-weight:850;
}


/* ==============================
   BOTTOM
============================== */

.bottom{
  position:fixed;

  z-index:50;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;

  padding:
    30px 12px
    calc(12px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      var(--bg) 45%
    );

  pointer-events:none;
}

#parentBtn{
  pointer-events:auto;

  min-height:49px;

  padding:
    0 20px;

  border:1px solid #E6D9C8;

  border-radius:999px;

  background:
    rgba(255,252,246,.96);

  color:#70665C;

  font-size:12px;
  font-weight:850;

  box-shadow:
    0 7px 20px rgba(64,49,37,.09);
}


/* ==============================
   TOAST
============================== */

.toast{
  position:fixed;

  z-index:200;

  left:50%;

  bottom:
    calc(
      88px +
      env(safe-area-inset-bottom)
    );

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  width:
    calc(100% - 30px);

  max-width:400px;

  padding:
    12px 14px;

  border-radius:16px;

  background:#665B52;

  color:#FFFDF8;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, arrayUnion, arrayRemove, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
(()=>{
"use strict";


/* ==============================
   CONFIG
============================== */

const STORAGE_KEY =
  "jessie-bookshelf-v5";

const PIN =
  "1234";

const firebaseConfig = {
  apiKey: "AIzaSyAR0VXqUw0sUaezOQaHPjExXn4LRwFbqWk",
  authDomain: "jessie-bookshelf.firebaseapp.com",
  projectId: "jessie-bookshelf",
  storageBucket: "jessie-bookshelf.firebasestorage.app",
  messagingSenderId: "304720995154",
  appId: "1:304720995154:web:22d57d1e13f52a24a3508b"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const googleProvider = new GoogleAuthProvider();
const booksCollection = collection(db,"libraries","jessie","books");

let cloudReady = false;
let cloudUser = null;
let unsubscribeBooks = null;
let applyingCloudSnapshot = false;


const categories = [

  {
    id:"all",
    name:"全部"
  },

  {
    id:"story",
    name:"中文繪本"
  },

  {
    id:"english",
    name:"英文繪本"
  },

  {
    id:"sensory",
    name:"感官互動"
  },

  {
    id:"readalong",
    name:"點讀系列"
  },

  {
    id:"cognitive",
    name:"認知探索"
  },

  {
    id:"music",
    name:"音樂兒歌"
  },

  {
    id:"favorite",
    name:"♡ 最愛"
  },

  {
    id:"later",
    name:"長大再讀"
  }

];


const categoryNames = {

  story:
    "故事繪本",

  english:
    "英文繪本",

  sensory:
    "感官・互動",

  readalong:
    "點讀・有聲",

  cognitive:
    "認知探索",

  music:
    "兒歌・音樂",

  other:
    "其他"

};


let books = [];

let selectedId = null;

let editingId = null;

let currentFilter =
  "all";

let keyword =
  "";

let sortMode =
  "added";

let pendingCover =
  "";

let lastReading =
  null;

let readLocked =
  false;

let toastTimer =
  null;


const $ = id =>
  document.getElementById(id);


/* ==============================
   HELPERS
============================== */

function makeId(
  prefix="id"
){

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


function getBook(id){

  return books.find(
    book =>
      book.id === id
  );

}


function dayKey(
  timestamp = Date.now()
){

  const date =
    new Date(timestamp);


  return [

    date.getFullYear(),

    String(
      date.getMonth()+1
    ).padStart(2,"0"),

    String(
      date.getDate()
    ).padStart(2,"0")

  ].join("-");

}


function totalReads(book){

  return (
    book.readingHistory || []
  ).length;

}


function todayReads(book){

  const today =
    dayKey();


  return (
    book.readingHistory || []
  ).filter(record=>{

    if(record.dateKey){

      return (
        record.dateKey
        ===
        today
      );

    }


    if(record.timestamp){

      return (
        dayKey(record.timestamp)
        ===
        today
      );

    }


    return false;

  }).length;

}


function latestReadTime(book){

  return Math.max(
    0,
    ...(book.readingHistory || [])
      .map(
        record =>
          Number(record.timestamp)
          ||
          0
      )
  );

}


function formatTime(timestamp){

  if(!timestamp){

    return "舊版共讀紀錄";

  }


  const date =
    new Date(timestamp);


  return (
    `${date.getFullYear()}/` +
    `${date.getMonth()+1}/` +
    `${date.getDate()} ` +
    `${String(
      date.getHours()
    ).padStart(2,"0")}:` +
    `${String(
      date.getMinutes()
    ).padStart(2,"0")}`
  );

}


/* ==============================
   STORAGE
============================== */

function normalizeBook(book,index=0){


  if(!book.id){

    book.id =
      makeId("book");

  }


  if(!book.category){

    book.category =
      "other";

  }


  if(!book.readingStatus){

    book.readingStatus =
      "now";

  }


  if(
    typeof book.favorite
    !==
    "boolean"
  ){

    book.favorite =
      false;

  }


  /*
    舊書原本沒有 createdAt，
    不破壞資料。

    用目前資料順序建立一個
    穩定的排序基準。
  */

  if(
    typeof book.createdAt
    !==
    "number"
  ){

    book.createdAt =
      index;

  }


  /*
    舊版只有 readCount，
    轉成 legacy 紀錄。

    legacy 不會算進今天。
  */

  if(
    !Array.isArray(
      book.readingHistory
    )
  ){

    book.readingHistory =
      [];


    const oldCount =
      Number(
    book.readCount
      ) || 0;


    for(
      let i=0;
      i<oldCount;
      i++
    ){

      book.readingHistory
    .push({

      id:
        makeId("legacy"),

      timestamp:
        null,

      legacy:
        true

    });

    }

  }


  book.readingHistory
    .forEach(record=>{

      if(!record.id){

    record.id =
      makeId("read");

      }

    });

}


function load(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    books =
      raw
        ? JSON.parse(raw)
        : [];


    if(
      !Array.isArray(books)
    ){

      books = [];

    }

  }


  catch(error){

    console.error(error);

    books = [];

  }


  books.forEach((book,index)=>normalizeBook(book,index));


  save();

}


function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(books)
    );


    return true;

  }


  catch(error){

    console.error(error);


    alert(
      "瀏覽器儲存空間不足。\n\n" +
      "建議先使用「備份」保存資料，" +
      "並盡量使用壓縮後的封面圖片。"
    );


    return false;

  }

}


/* ==============================
   FIREBASE CLOUD SYNC
============================== */

function setCloudUI(state,text=""){
  const dot=$("cloudDot");
  dot.className="cloud-dot" + (state==="online" ? " online" : state==="busy" ? " busy" : "");
  if(state==="online"){
    $("cloudTitle").textContent="家庭書庫已同步";
    $("cloudText").textContent=text || (cloudUser?.displayName ? `${cloudUser.displayName} · Firebase` : "Firebase 雲端同步中");
    $("cloudBtn").textContent="登出";
  }else if(state==="busy"){
    $("cloudTitle").textContent="正在連接家庭書庫";
    $("cloudText").textContent=text || "請稍候…";
    $("cloudBtn").textContent="請稍候";
  }else{
    $("cloudTitle").textContent="本機書庫";
    $("cloudText").textContent=text || "登入後可和家人同步";
    $("cloudBtn").textContent="Google 登入";
  }
}

function approxBookBytes(book){
  return new Blob([JSON.stringify(book)]).size;
}

async function syncBookToCloud(book){
  if(!cloudReady || !cloudUser || !book) return;
  if(approxBookBytes(book) > 900000){
    alert(`《${book.title}》的封面檔案太大，已保留在本機，但暫時無法同步到雲端。\n\n請重新編輯這本書並上傳較小的封面。`);
    return;
  }
  try{
    await setDoc(doc(booksCollection,book.id),book);
  }catch(error){
    console.error(error);
    showToast("雲端同步失敗，本機資料仍保留",false);
  }
}

async function addReadingToCloud(bookId,record){
  if(!cloudReady || !cloudUser) return;
  try{
    await updateDoc(doc(booksCollection,bookId),{readingHistory:arrayUnion(record)});
  }catch(error){ console.error(error); showToast("共讀已存本機，雲端同步失敗",false); }
}

async function removeReadingFromCloud(bookId,record){
  if(!cloudReady || !cloudUser) return;
  try{
    await updateDoc(doc(booksCollection,bookId),{readingHistory:arrayRemove(record)});
  }catch(error){ console.error(error); showToast("本機已更新，雲端同步失敗",false); }
}

async function deleteBookFromCloud(bookId){
  if(!cloudReady || !cloudUser) return;
  try{ await deleteDoc(doc(booksCollection,bookId)); }
  catch(error){ console.error(error); showToast("本機已刪除，但雲端刪除失敗",false); }
}

async function uploadLocalLibrary(){
  const oversized=books.filter(book=>approxBookBytes(book)>900000);
  if(oversized.length){
    alert(`有 ${oversized.length} 本書的封面資料太大，為避免遺失，這次不會開始搬移。\n\n請保留剛才的 JSON 備份，再把這些書的封面重新上傳成較小圖片。`);
    return false;
  }
  setCloudUI("busy",`正在上傳 ${books.length} 本書…`);
  try{
    const batch=writeBatch(db);
    books.forEach(book=>batch.set(doc(booksCollection,book.id),book));
    await batch.commit();
    return true;
  }catch(error){
    console.error(error);
    alert("第一次上傳失敗。你的原本書庫仍完整保留在這台裝置與備份檔中。\n\n"+(error?.message||""));
    return false;
  }
}

async function replaceCloudLibrary(){
  if(!cloudReady || !cloudUser) return;
  try{
    const snap=await getDocs(booksCollection);
    const batch=writeBatch(db);
    snap.forEach(item=>batch.delete(item.ref));
    for(const book of books){
      if(approxBookBytes(book)>900000) throw new Error(`《${book.title}》封面資料太大`);
      batch.set(doc(booksCollection,book.id),book);
    }
    await batch.commit();
  }catch(error){ console.error(error); alert("雲端匯入同步失敗；本機匯入資料仍保留。\n"+(error?.message||"")); }
}

function startCloudListener(){
  if(unsubscribeBooks) unsubscribeBooks();
  unsubscribeBooks=onSnapshot(booksCollection,snapshot=>{
    if(!cloudReady) return;
    applyingCloudSnapshot=true;
    books=snapshot.docs.map(item=>item.data());
    books.forEach((book,index)=>normalizeBook(book,index));
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(books)); }catch(error){ console.error(error); }
    renderAll();
    if(selectedId){ const selected=getBook(selectedId); if(selected && $("detailDialog").open) renderDetail(selected); }
    applyingCloudSnapshot=false;
    setCloudUI("online");
  },async error=>{
    console.error(error);
    cloudReady=false;
    if(error?.code==="permission-denied"){
      alert("這個 Google 帳號沒有家庭書庫的使用權限。請改用已授權的帳號登入。");
      try{ await signOut(auth); }catch(_){}
    }else{
      setCloudUI("offline","雲端連線中斷，本機資料仍可使用");
    }
  });
}

async function prepareCloud(user){
  cloudUser=user;
  setCloudUI("busy","正在檢查雲端書庫…");
  try{
    const snapshot=await getDocs(booksCollection);
    const cloudBooks=snapshot.docs.map(item=>item.data());
    if(cloudBooks.length===0 && books.length>0){
      const ok=confirm(`雲端書庫目前是空的。\n\n這台裝置有 ${books.length} 本書。要把這台現有書庫上傳成家庭共用書庫嗎？\n\n你的本機資料與備份不會被刪除。`);
      if(!ok){
        cloudReady=false;
        setCloudUI("offline","尚未搬移；目前仍使用本機書庫");
        return;
      }
      const uploaded=await uploadLocalLibrary();
      if(!uploaded){ cloudReady=false; setCloudUI("offline","第一次上傳尚未完成"); return; }
    }else if(cloudBooks.length>0){
      books=cloudBooks;
      books.forEach((book,index)=>normalizeBook(book,index));
      try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(books)); }catch(error){ console.error(error); }
      renderAll();
    }
    cloudReady=true;
    setCloudUI("online");
    startCloudListener();
  }catch(error){
    console.error(error);
    cloudReady=false;
    if(error?.code==="permission-denied"){
      alert("這個 Google 帳號沒有家庭書庫的使用權限。請改用已授權的帳號登入。");
      await signOut(auth);
    }else{
      setCloudUI("offline","無法連接 Firebase，本機資料仍可使用");
      alert("目前無法連接家庭書庫。你的本機資料沒有被刪除。\n\n"+(error?.message||""));
    }
  }
}

$("cloudBtn").onclick=async()=>{
  if(cloudUser){
    if(confirm("要登出家庭書庫嗎？")) await signOut(auth);
    return;
  }
  try{

    if(error?.code!=="auth/popup-closed-by-user") alert("Google 登入沒有完成。請再試一次。\n\n"+(error?.message||""));
    setCloudUI("offline");
  }
};

/* ==============================
   FILTER + SORT
============================== */

function filteredBooks(){

  let list =
    [...books];


  if(
    currentFilter
    ===
    "favorite"
  ){

    list =
      list.filter(
        book =>
          book.favorite
      );

  }


  else if(
    currentFilter
    ===
    "later"
  ){

    list =
      list.filter(
        book =>
          book.readingStatus
          ===
          "later"
      );

  }


  else if(
    currentFilter
    !==
    "all"
  ){

    list =
      list.filter(
        book =>

          book.category
          ===
          currentFilter

          &&

          book.readingStatus
          !==
          "later"

      );

  }


  if(keyword){

    const key =
      keyword.toLowerCase();


    list =
      list.filter(book=>

        (book.title || "")
          .toLowerCase()
          .includes(key)

        ||

        (book.note || "")
          .toLowerCase()
          .includes(key)

      );

  }


  if(
    sortMode
    ===
    "read"
  ){

    list.sort(
      (a,b)=>
        latestReadTime(b)
        -
        latestReadTime(a)
    );

  }


  else if(
    sortMode
    ===
    "title"
  ){

    list.sort(
      (a,b)=>

        (a.title || "")
          .localeCompare(
            b.title || "",
            "zh-Hant",
            {
              numeric:true,
              sensitivity:"base"
            }
          )

    );

  }


  else{

    list.sort(
      (a,b)=>

        (Number(b.createdAt) || 0)
        -
        (Number(a.createdAt) || 0)

    );

  }


  return list;

}

/* ==============================
   IMAGE COMPRESSION
============================== */

function compressImage(
  file,
  options={}
){

  const {

    maxWidth=700,

    maxHeight=1000,

    quality=.76

  } = options;


  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload = ()=>{

        const image =
          new Image();


        image.onload = ()=>{

          const scale =
            Math.min(

              1,

              maxWidth /
                image.width,

              maxHeight /
                image.height

            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            Math.round(
              image.width *
              scale
            );


          canvas.height =
            Math.round(
              image.height *
              scale
            );


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.fillStyle =
            "#FFFFFF";


          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


        image.onerror =
          reject;


        image.src =
          reader.result;

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* ==============================

============================== */

$("onlineCoverBtn")
  .onclick =
  async ()=>{

    const title =
      $("bookTitle")
        .value
        .trim();


    if(!title){

      $("coverSearchMessage")
        .textContent =
          "請先輸入書名";


      return;

    }


    $("coverSearchMessage")
      .textContent =
        "搜尋中…";


    $("coverResults")
      .innerHTML =
        "";


    try{

      const url =
        "https://openlibrary.org/search.json?title=" +
        encodeURIComponent(
          title
        ) +
        "&limit=12&fields=key,title,cover_i";


      const response =
        await fetch(url);


      if(!response.ok){

        throw new Error(
          "cover search failed"
        );

      }


      const data =
        await response.json();


      const results =
        (data.docs || [])
          .filter(
            item =>
              item.cover_i
          )
          .slice(0,6);


      if(
        !results.length
      ){

        $("coverSearchMessage")
          .textContent =
            "沒有找到封面，建議直接上傳你手上的版本。";


        return;

      }


      $("coverSearchMessage")
        .textContent =
          "請確認是不是你手上的版本";


      results.forEach(
        item=>{

          const coverURL =
            `https://covers.openlibrary.org/b/id/${item.cover_i}-L.jpg`;


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "cover-choice";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            coverURL;


          image.alt =
            item.title || title;


          button.appendChild(
            image
          );


          button.onclick =
            ()=>{

              document
                .querySelectorAll(
                  ".cover-choice"
                )
                .forEach(choice=>

                  choice.classList
                    .remove(
                      "selected"
                    )

                );


              button.classList
                .add(
                  "selected"
                );


              pendingCover =
                coverURL;


              updateCoverPreview();

            };


          $("coverResults")
            .appendChild(
              button
            );

        }
      );

    }


    catch(error){

      console.error(error);


      $("coverSearchMessage")
        .textContent =
          "目前無法搜尋，可以直接上傳封面。";

    }

  };


/* ==============================
   SAVE BOOK
============================== */

$("bookForm")
  .onsubmit =
  event=>{

    event.preventDefault();


    const data = {

      title:
        $("bookTitle")
          .value
          .trim(),

      category:
        $("bookCategory")
          .value,

      age:
        $("bookAge")
          .value
          .trim()
        ||
        "不限",

      readingStatus:
        $("bookStatus")
          .value,

      note:
        $("bookNote")
          .value
          .trim(),

      cover:
        pendingCover

    };


    if(editingId){

      const book =
        getBook(
          editingId
        );


      if(book){

        Object.assign(
          book,
          data
        );

      }

    }


    else{

      books.push({

        id:
          makeId("book"),

        ...data,

        favorite:
          false,

        createdAt:
          Date.now(),

        readingHistory:
          []

      });

    }


    if(save()){

      const changedBook = editingId ? getBook(editingId) : books[books.length-1];
      syncBookToCloud(changedBook);

      $("editDialog")
        .close();


      renderAll();

    }

  };


/* ==============================
   DELETE BOOK
============================== */

$("deleteBtn")
  .onclick = ()=>{

    const book =
      getBook(
        selectedId
      );


    if(!book){
      return;
    }


    if(
      !confirm(
        `確定刪除《${book.title}》？\n\n` +
        "封面、筆記與共讀紀錄都會一起刪除。"
      )
    ){

      return;

    }


    books =
      books.filter(
        item =>
          item.id
          !==
          book.id
      );


    selectedId =
      null;


    save();
    deleteBookFromCloud(book.id);


    $("detailDialog")
      .close();


    renderAll();

  };


/* ==============================
   EXPORT
============================== */

$("exportBtn")
  .onclick = ()=>{

    const backup = {

      version:
        13,

      name:
        "潔心的小圖書館",

      exportedAt:
        new Date()
          .toISOString(),

      books

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "潔心的小圖書館-backup.json";


    link.click();


    setTimeout(
      ()=>
        URL.revokeObjectURL(
          url
        ),
      1000
    );

  };


/* ==============================
   IMPORT
============================== */

$("importBtn")
  .onclick = ()=>{

    $("importFile")
      .click();

  };


$("importFile")
  .onchange =
  function(){

    const file =
      this.files?.[0];


    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload = ()=>{

      try{

        const parsed =
          JSON.parse(
            reader.result
          );


        const incoming =
          Array.isArray(parsed)

          ? parsed

          : parsed.books;


        if(
          !Array.isArray(
            incoming
          )
        ){

          throw new Error(
            "invalid backup"
          );

        }


        if(
          !confirm(
            "匯入備份會取代目前資料，確定嗎？"
          )
        ){

          return;

        }


        books =
          incoming;


        save();

        if(cloudReady && cloudUser){
          const syncNow = confirm("目前已連接家庭書庫。要用這份備份取代雲端書庫嗎？");
          if(syncNow){
            replaceCloudLibrary().then(()=>location.reload());
            return;
          }
        }

        location.reload();

      }


      catch(error){

        console.error(error);


        alert(
          "這不是有效的潔心小圖書館備份"
        );

      }

    };


    reader.readAsText(
      file
    );

  };


/* ==============================
   TOAST
============================== */

function showToast(
  text,
  undo=false
){

  clearTimeout(
    toastTimer
  );


  $("toastText")
    .textContent =
      text;


  $("undoBtn")
    .style.display =
      undo
      ? "block"
      : "none";


  $("toast")
    .classList
    .add(
      "show"
    );


  toastTimer =
    setTimeout(
      hideToast,
      7000
    );

}


function hideToast(){

  $("toast")
    .classList
    .remove(
      "show"
    );

}


/* ==============================
   RENDER ALL
============================== */

function renderAll(){

  renderStats();

  renderToday();

  renderFilters();

  renderBooks();

}


/* ==============================
   START
============================== */

load();

renderAll();


})();
</script>

</body>
</html>

<!-- =========================
     共讀區塊
     放在書本詳細頁
========================= -->

<div class="reading-section">

  <!-- 小孩可以按，不會增加紀錄 -->
  <button id="chooseBookBtn" class="big-btn choose-btn">
    📖 我們來讀這本！
  </button>

  <!-- 家長才按這個，真正記錄閱讀 -->
  <button id="completeReadingBtn" class="big-btn complete-btn">
    ✓ 完成一次共讀
  </button>

  <!-- 統計 -->
  <div class="reading-stats">
    <div>
      <strong id="todayReadCount">0</strong>
      <span>今天</span>
    </div>

    <div>
      <strong id="totalReadCount">0</strong>
      <span>累積</span>
    </div>
  </div>

</div>

<!-- 按錯後出現 -->
<div id="undoToast" class="undo-toast">
  <span>✨ 已記錄一次共讀</span>
  <button id="undoReadingBtn">↩︎ 復原</button>
</div>


<style>

/* =========================
   共讀按鈕
========================= */

.reading-section {
  margin-top: 22px;
}

.big-btn {
  width: 100%;
  min-height: 60px;

  border: none;
  border-radius: 22px;

  font-size: 20px;
  font-weight: 800;

  margin-bottom: 12px;

  cursor: pointer;
}

/* Jessie 可以按 */
.choose-btn {
  background: linear-gradient(
    135deg,
    #f6a23c,
    #df845d
  );

  color: white;
}

/* 真正紀錄閱讀 */
.complete-btn {
  background: #b9d8ae;
  color: #3f5438;
}

/* 如果你有 parent mode
   可以改成只有家長模式顯示 */

body:not(.parent) .complete-btn {
  display: none;
}


/* =========================
   閱讀統計
========================= */

.reading-stats {

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 12px;

  margin-top: 15px;
}

.reading-stats div {

  background: #f7efe5;

  border-radius: 18px;

  padding: 13px 10px;

  display: flex;
  flex-direction: column;

  align-items: center;
}

.reading-stats strong {

  font-size: 25px;
  color: #704b32;
}

.reading-stats span {

  font-size: 13px;
  color: #8c796c;

  margin-top: 2px;
}


/* =========================
   復原提示
========================= */

.undo-toast {

  position: fixed;

  left: 50%;
  bottom: calc(
    25px + env(safe-area-inset-bottom)
  );

  transform: translateX(-50%)
             translateY(100px);

  width: calc(100% - 32px);
  max-width: 420px;

  background: #4b4038;
  color: white;

  border-radius: 18px;

  padding: 13px 16px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  z-index: 999;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s,
    transform .25s;
}

.undo-toast.show {

  opacity: 1;

  transform: translateX(-50%)
             translateY(0);

  pointer-events: auto;
}

.undo-toast button {

  border: none;

  background: #fff;

  color: #6c4c39;

  padding: 9px 13px;

  border-radius: 999px;

  font-weight: 800;

  cursor: pointer;
}

</style>


<script>

/* ==================================================
   Jessie 書櫃 — 閱讀紀錄系統
================================================== */


/*
假設你的 books 原本長這樣：

{
  id: "book_001",
  title: "小黃點",
  readCount: 2
}

現在我們改成：

{
  id: "book_001",
  title: "小黃點",

  readingHistory: [
    {
      id: "read_xxx",
      timestamp: 123456789
    }
  ]
}

*/


/* ==================================================
   建立 ID
   不使用 crypto.randomUUID
   避免某些 iPhone / file preview 問題
================================================== */

function createID(prefix = "id") {

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2, 8)
  );

}


/* ==================================================
   取得「今天」
   使用手機本地時間
================================================== */

function getLocalDateString(timestamp = Date.now()) {

  const date = new Date(timestamp);

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


/* ==================================================
   舊資料升級
================================================== */

function migrateReadingData() {

  books.forEach(book => {

    if (
      !Array.isArray(
        book.readingHistory
      )
    ) {

      book.readingHistory = [];

      /*
      如果以前已經有 readCount，
      不知道確切是哪一天讀的，
      所以保留成 legacy 紀錄。
      */

      const oldCount =
        Number(book.readCount) || 0;

      for (
        let i = 0;
        i < oldCount;
        i++
      ) {

        book.readingHistory.push({

          id:
            createID(
              "legacy"
            ),

          timestamp: null,

          legacy: true

        });

      }

    }

    /*
    readCount 不再作為
    真正資料來源
    */

    delete book.readCount;

  });

  saveBooks();

}


/* ==================================================
   取得指定書籍
================================================== */

function getBookById(bookId) {

  return books.find(
    book =>
      book.id === bookId
  );

}


/* ==================================================
   計算總共讀次數
================================================== */

function getTotalReadingCount(book) {

  if (
    !book ||
    !Array.isArray(
      book.readingHistory
    )
  ) {

    return 0;

  }

  return book
    .readingHistory
    .length;

}


/* ==================================================
   計算今天讀幾次
================================================== */

function getTodayReadingCount(book) {

  if (
    !book ||
    !Array.isArray(
      book.readingHistory
    )
  ) {

    return 0;

  }

  const today =
    getLocalDateString();

  return book
    .readingHistory
    .filter(record => {

      /*
      舊資料沒有日期，
      不算進「今天」
      */

      if (
        !record.timestamp
      ) {

        return false;

      }

      return (
        getLocalDateString(
          record.timestamp
        ) === today
      );

    })
    .length;

}


/* ==================================================
   最近一次真正有日期的閱讀
================================================== */

function getLastReading(book) {

  if (
    !book ||
    !Array.isArray(
      book.readingHistory
    )
  ) {

    return null;

  }

  const records =
    book
      .readingHistory
      .filter(
        record =>
          record.timestamp
      )
      .sort(
        (a, b) =>
          b.timestamp -
          a.timestamp
      );

  return (
    records[0] || null
  );

}


/* ==================================================
   記錄一次共讀
================================================== */

let lastAddedReading = null;

let undoTimer = null;


function completeReading(bookId) {

  const book =
    getBookById(bookId);

  if (!book) return;

  if (
    !Array.isArray(
      book.readingHistory
    )
  ) {

    book.readingHistory = [];

  }


  const record = {

    id:
      createID("read"),

    timestamp:
      Date.now()

  };


  book
    .readingHistory
    .push(record);


  /*
  保存剛剛新增的紀錄
  讓我們可以精準復原
  */

  lastAddedReading = {

    bookId:
      book.id,

    readingId:
      record.id

  };


  saveBooks();

  updateReadingUI(book);

  showUndoToast();

}


/* ==================================================
   復原剛才的共讀
================================================== */

function undoLastReading() {

  if (
    !lastAddedReading
  ) {

    return;

  }


  const book =
    getBookById(
      lastAddedReading.bookId
    );


  if (!book) return;


  book.readingHistory =
    book
      .readingHistory
      .filter(
        record =>
          record.id !==
          lastAddedReading.readingId
      );


  saveBooks();

  updateReadingUI(book);


  lastAddedReading = null;


  hideUndoToast();

}


/* ==================================================
   更新畫面上的閱讀數字
================================================== */

function updateReadingUI(book) {

  const today =
    getTodayReadingCount(
      book
    );

  const total =
    getTotalReadingCount(
      book
    );


  const todayElement =
    document.getElementById(
      "todayReadCount"
    );

  const totalElement =
    document.getElementById(
      "totalReadCount"
    );


  if (todayElement) {

    todayElement
      .textContent =
      today;

  }


  if (totalElement) {

    totalElement
      .textContent =
      total;

  }


  /*
  如果你原本有：
  已共讀 X 次

  可以同步更新
  */

  const oldCounter =
    document.getElementById(
      "detailReadCount"
    );


  if (oldCounter) {

    oldCounter
      .textContent =
      `已共讀 ${total} 次`;

  }

}


/* ==================================================
   顯示復原
================================================== */

function showUndoToast() {

  const toast =
    document.getElementById(
      "undoToast"
    );


  if (!toast) return;


  toast
    .classList
    .add("show");


  clearTimeout(
    undoTimer
  );


  /*
  10 秒後收起來

  注意：
  紀錄不會消失，
  只是復原快捷鍵消失。
  */

  undoTimer =
    setTimeout(
      hideUndoToast,
      10000
    );

}


/* ==================================================
   隱藏復原
================================================== */

function hideUndoToast() {

  const toast =
    document.getElementById(
      "undoToast"
    );


  if (!toast) return;


  toast
    .classList
    .remove("show");

}


/* ==================================================
   Jessie 按「我們來讀這本」
================================================== */

function chooseBook() {

  /*
  非常重要：

  這裡完全不增加閱讀次數。

  所以 Jessie 可以一直按，
  不會破壞媽媽的閱讀統計。
  */


  showLittleCelebration();

}


/* ==================================================
   簡單星星動畫
================================================== */

function showLittleCelebration() {

  const icons =
    ["⭐", "♡", "✨"];


  icons.forEach(
    (icon, index) => {

      const star =
        document.createElement(
          "span"
        );


      star.textContent =
        icon;


      star.style.position =
        "fixed";


      star.style.left =
        (
          40 +
          Math.random() * 20
        ) + "vw";


      star.style.top =
        (
          55 +
          Math.random() * 10
        ) + "vh";


      star.style.fontSize =
        "28px";


      star.style.zIndex =
        "9999";


      star.style.pointerEvents =
        "none";


      star.style.transition =
        "all .8s ease";


      document.body
        .appendChild(star);


      requestAnimationFrame(
        () => {

          star.style
            .transform =
            "translateY(-80px)";

          star.style
            .opacity =
            "0";

        }
      );


      setTimeout(
        () =>
          star.remove(),
        900
      );

    }
  );

}


/* ==================================================
   按鈕事件
================================================== */

document
  .getElementById(
    "chooseBookBtn"
  )
  ?.addEventListener(
    "click",
    chooseBook
  );


document
  .getElementById(
    "completeReadingBtn"
  )
  ?.addEventListener(
    "click",
    () => {

      /*
      selectedBookId
      使用你目前書本詳細頁
      已選中的 book ID
      */

      if (
        !selectedBookId
      ) {

        return;

      }


      completeReading(
        selectedBookId
      );

    }
  );


document
  .getElementById(
    "undoReadingBtn"
  )
  ?.addEventListener(
    "click",
    undoLastReading
  );


/* ==================================================
   開啟書本詳細頁時呼叫
================================================== */

/*

在你原本的 openBook(bookId)
裡面加入：

selectedBookId = bookId;

const book =
  getBookById(bookId);

updateReadingUI(book);

*/


/* ==================================================
   App 第一次啟動
================================================== */

/*

在 loadBooks() 完成後呼叫一次：

migrateReadingData();

注意：
如果 migrateReadingData 每次都會 saveBooks，
建議你的正式版再增加 schemaVersion，
避免重複 migration。

*/

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#fff9f0">

<title>Jessie 的小書櫃</title>

<style>
/* =========================================================
   Jessie Bookshelf V6
   ========================================================= */

:root{
  --bg:#fff9f0;
  --paper:#fffefa;
  --text:#503a2b;
  --muted:#998375;

  --orange:#ef9d58;
  --orange2:#df805b;

  --pink:#efa6b5;
  --pinkSoft:#ffe8ed;

  --green:#bdd7b4;
  --greenText:#40583b;

  --woodLight:#e5b27b;
  --wood:#c98b50;
  --woodDark:#945e32;

  --cream:#f5ede3;

  --danger:#a94848;
  --dangerSoft:#ffe7e7;

  --shadow:0 8px 25px rgba(70,45,28,.13);
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -5%,
      #ffffff 0%,
      #fffaf2 40%,
      var(--bg) 100%
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  padding-bottom:
    calc(100px + env(safe-area-inset-bottom));
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

img{
  display:block;
}


/* =========================================================
   HEADER
   ========================================================= */

.app-header{
  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    8px;

  text-align:center;
}

.app-title{
  margin:0;

  font-size:
    clamp(29px,8vw,42px);

  line-height:1.15;

  font-weight:900;

  letter-spacing:-1px;
}

.app-subtitle{
  margin-top:10px;

  font-size:17px;

  color:var(--muted);
}

.global-stats{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  margin-top:15px;

  padding:9px 16px;

  border-radius:999px;

  background:#fff;

  box-shadow:
    0 4px 18px
    rgba(70,45,28,.08);

  font-size:14px;
}


/* =========================================================
   TODAY
   ========================================================= */

.today-card{
  width:calc(100% - 28px);
  max-width:650px;

  margin:14px auto 18px;

  padding:17px;

  background:rgba(255,255,255,.82);

  border:2px solid #eed7bc;

  border-radius:24px;

  box-shadow:
    0 6px 22px
    rgba(77,54,35,.06);
}

.today-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.today-title{
  font-size:18px;
  font-weight:900;
}

.today-total{
  padding:5px 10px;

  border-radius:999px;

  background:var(--cream);

  color:#806b5b;

  font-size:12px;
  font-weight:800;
}

.today-empty{
  padding:8px 0 3px;

  color:var(--muted);

  font-size:14px;

  line-height:1.5;
}

.today-list{
  display:flex;
  flex-direction:column;

  gap:7px;
}

.today-row{
  display:flex;
  align-items:center;

  width:100%;

  padding:9px 11px;

  border-radius:14px;

  background:#fffaf5;
}

.today-book-icon{
  flex:0 0 auto;

  margin-right:8px;
}

.today-book-name{
  flex:1;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:14px;
}

.today-count{
  flex:0 0 auto;

  margin-left:10px;

  padding:4px 9px;

  border-radius:999px;

  background:#f1e6d9;

  color:#775e4c;

  font-size:13px;
  font-weight:900;
}


/* =========================================================
   SEARCH
   ========================================================= */

.discovery{
  width:calc(100% - 28px);
  max-width:650px;

  margin:0 auto 18px;
}

.search-wrap{
  position:relative;
}

.search-icon{
  position:absolute;

  left:15px;
  top:50%;

  transform:translateY(-50%);

  pointer-events:none;
}

#searchInput{
  width:100%;

  min-height:52px;

  padding:
    12px
    45px
    12px
    45px;

  border:1.5px solid #eadccd;

  border-radius:19px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-size:16px;

  box-shadow:
    0 4px 15px
    rgba(70,45,28,.05);
}

#searchInput:focus{
  border-color:#d9a875;
}

.clear-search{
  position:absolute;

  right:8px;
  top:50%;

  transform:translateY(-50%);

  width:36px;
  height:36px;

  border:0;

  border-radius:50%;

  background:transparent;

  color:#9b887b;

  font-size:18px;

  display:none;
}

.clear-search.show{
  display:grid;
  place-items:center;
}


/* =========================================================
   FILTERS
   ========================================================= */

.filter-scroll{
  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:11px 2px 5px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.filter-scroll::-webkit-scrollbar{
  display:none;
}

.filter-button{
  flex:0 0 auto;

  min-height:42px;

  padding:8px 14px;

  border:1px solid #eadccd;

  border-radius:999px;

  background:#fff;

  color:#765f50;

  font-size:14px;
  font-weight:800;
}

.filter-button.active{
  background:var(--pink);

  border-color:var(--pink);

  color:#fff;
}


/* =========================================================
   PARENT TOOLS
   ========================================================= */

.parent-tools{
  display:none;

  width:calc(100% - 28px);
  max-width:650px;

  margin:0 auto 20px;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

body.parent-mode .parent-tools{
  display:grid;
}

.tool-btn{
  min-width:0;
  min-height:50px;

  border:0;

  border-radius:17px;

  background:#fff;

  color:var(--text);

  font-size:13px;
  font-weight:850;

  box-shadow:
    0 4px 15px
    rgba(70,45,28,.08);
}


/* =========================================================
   BOOKCASE
   ========================================================= */

#bookcase{
  width:100%;
}

.category-shelf{
  width:100%;

  margin-bottom:24px;
}

.shelf-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  width:100%;

  padding:0 18px 8px;

  gap:10px;
}

.shelf-title{
  font-size:19px;

  font-weight:900;
}

.shelf-count{
  color:var(--muted);

  font-size:12px;
}

.shelf-hint{
  padding:
    0
    18px
    4px;

  color:#aa9485;

  font-size:12px;
}


/* =========================================================
   BOOK ROW
   ========================================================= */

.book-row{
  position:relative;

  display:flex;

  align-items:flex-end;

  gap:14px;

  width:100%;

  overflow-x:auto;
  overflow-y:visible;

  padding:
    27px
    calc(50vw - 72px)
    28px;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior-x:contain;
}

.book-row::-webkit-scrollbar{
  display:none;
}


/* =========================================================
   REAL BOOK
   ========================================================= */

.book-item{
  flex:0 0 144px;

  width:144px;

  border:0;

  padding:0;

  background:transparent;

  color:inherit;

  scroll-snap-align:center;

  position:relative;

  transform:
    scale(.88)
    translateY(6px);

  opacity:.76;

  transition:
    transform .22s ease,
    opacity .22s ease,
    filter .22s ease;

  transform-origin:
    center bottom;
}

.book-item.center-book{
  transform:
    scale(1.08)
    translateY(-5px);

  opacity:1;

  z-index:5;
}

.book-item:active{
  transform:
    scale(1.02)
    translateY(-2px);
}


/* =========================================================
   BOOK OBJECT
   ========================================================= */

.book-object{
  position:relative;

  width:144px;
  height:192px;

  margin:auto;

  perspective:700px;
}


/* 書本厚度 */

.book-object::before{
  content:"";

  position:absolute;

  left:5px;
  right:-5px;
  bottom:-6px;

  height:13px;

  border-radius:
    0
    4px
    5px
    4px;

  background:
    linear-gradient(
      to bottom,
      #f7f0e7,
      #cbbbab
    );

  transform:
    skewX(-18deg);

  box-shadow:
    3px 5px 8px
    rgba(58,37,22,.18);

  z-index:-1;
}


/* 書脊 */

.book-object::after{
  content:"";

  position:absolute;

  top:4px;
  bottom:3px;
  left:-5px;

  width:9px;

  border-radius:
    5px
    0
    0
    5px;

  background:
    linear-gradient(
      to right,
      rgba(70,43,25,.35),
      rgba(255,255,255,.13)
    );

  z-index:3;

  pointer-events:none;
}


.book-cover{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:
    5px
    9px
    8px
    4px;

  background:#eea26a;

  box-shadow:
    9px 13px 20px
    rgba(58,37,22,.23),
    1px 2px 3px
    rgba(58,37,22,.18);

  transform:
    rotateY(-1deg);

  transform-origin:left center;
}

.book-cover img{
  width:100%;
  height:100%;

  object-fit:cover;

  background:#fff;
}

.book-gloss{
  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.22),
      transparent 23%,
      transparent 78%,
      rgba(0,0,0,.05)
    );
}


/* =========================================================
   PLACEHOLDER COVER
   ========================================================= */

.placeholder-cover{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:14px;

  color:white;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #f4b27a,
      #df855e
    );
}

.placeholder-icon{
  width:65px;
  height:65px;

  display:grid;
  place-items:center;

  margin-bottom:14px;

  border-radius:50%;

  background:
    rgba(255,255,255,.22);

  font-size:30px;
}

.placeholder-title{
  font-size:13px;

  line-height:1.35;

  font-weight:900;
}


/* =========================================================
   BOOK LABEL
   ========================================================= */

.book-label{
  width:144px;

  margin-top:13px;

  text-align:center;
}

.book-name{
  display:-webkit-box;

  overflow:hidden;

  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  min-height:35px;

  font-size:13px;

  line-height:1.3;

  font-weight:850;
}

.favorite-mark{
  margin-top:3px;

  color:#e98da2;

  font-size:13px;
}


/* =========================================================
   WOOD SHELF
   ========================================================= */

.wood-plank{
  position:relative;

  height:24px;

  margin-top:-16px;

  background:
    linear-gradient(
      180deg,
      #e8bb87 0%,
      #d49b61 52%,
      #bd7d43 100%
    );

  border-top:
    2px solid
    rgba(255,255,255,.45);

  border-bottom:
    6px solid
    var(--woodDark);

  box-shadow:
    0 9px 13px
    rgba(71,43,23,.2);
}

.wood-plank::after{
  content:"";

  position:absolute;

  inset:3px 0 6px;

  opacity:.17;

  background:
    repeating-linear-gradient(
      3deg,
      transparent 0,
      transparent 18px,
      rgba(91,53,28,.35) 19px,
      transparent 21px
    );
}


/* =========================================================
   NO RESULTS
   ========================================================= */

.no-results{
  width:calc(100% - 32px);

  margin:30px auto;

  padding:35px 20px;

  border-radius:24px;

  background:#fff;

  text-align:center;

  color:var(--muted);

  box-shadow:var(--shadow);
}


/* =========================================================
   BOTTOM BAR
   ========================================================= */

.bottom-bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  display:flex;
  justify-content:center;

  padding:
    22px
    14px
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  background:
    linear-gradient(
      transparent,
      var(--bg) 34%
    );

  pointer-events:none;
}

.parent-mode-btn{
  pointer-events:auto;

  min-height:52px;

  padding:0 22px;

  border:0;

  border-radius:999px;

  background:#fff;

  color:var(--text);

  font-weight:900;

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.13);
}


/* =========================================================
   DIALOG
   ========================================================= */

dialog{
  width:min(92vw,440px);

  max-height:92dvh;

  margin:auto;

  padding:0;

  border:
    4px solid
    #c99d6b;

  border-radius:28px;

  background:var(--paper);

  color:var(--text);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.42);

  overflow:auto;
}

dialog::backdrop{
  background:
    rgba(58,47,38,.65);

  backdrop-filter:
    blur(4px);
}

.modal{
  padding:19px;
}

.modal-close{
  position:sticky;

  top:0;

  z-index:10;

  display:grid;

  place-items:center;

  width:46px;
  height:46px;

  margin-left:auto;

  border:0;

  border-radius:50%;

  background:#f1e8dc;

  color:var(--text);

  font-size:24px;
}


/* =========================================================
   DETAIL
   ========================================================= */

.detail-cover-wrap{
  width:min(56vw,225px);

  margin:
    -27px
    auto
    0;
}

.detail-book{
  position:relative;

  width:100%;

  aspect-ratio:3/4;

  filter:
    drop-shadow(
      10px 15px 12px
      rgba(50,31,18,.25)
    );
}

.detail-book::before{
  content:"";

  position:absolute;

  left:-7px;
  top:5px;
  bottom:5px;

  width:10px;

  border-radius:6px 0 0 6px;

  background:
    linear-gradient(
      to right,
      rgba(62,37,20,.45),
      rgba(255,255,255,.08)
    );

  z-index:3;
}

.detail-cover{
  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:
    7px
    15px
    13px
    5px;

  background:#eea26a;
}

.detail-cover img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.detail-title{
  margin:
    19px
    0
    10px;

  text-align:center;

  font-size:25px;

  line-height:1.25;
}

.detail-tags{
  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:7px;
}

.tag{
  padding:7px 11px;

  border-radius:999px;

  background:var(--cream);

  color:#806c5e;

  font-size:13px;

  font-weight:800;
}


/* =========================================================
   NOTE
   ========================================================= */

.note-box{
  display:none;

  margin-top:17px;

  padding:14px;

  border:
    2px dashed
    #e3a06b;

  border-radius:18px;

  background:#fffaf2;

  line-height:1.55;
}

body.parent-mode .note-box{
  display:block;
}

.note-heading{
  margin-bottom:4px;

  font-weight:900;
}


/* =========================================================
   CHILD ACTIONS
   ========================================================= */

.child-action{
  width:100%;

  min-height:61px;

  margin-top:15px;

  border:0;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      var(--orange),
      var(--orange2)
    );

  color:white;

  font-size:19px;

  font-weight:900;
}

.favorite-btn{
  width:100%;

  min-height:54px;

  margin-top:10px;

  border:
    3px solid
    #caa173;

  border-radius:20px;

  background:white;

  color:var(--text);

  font-size:17px;

  font-weight:900;
}


/* =========================================================
   PARENT READING
   ========================================================= */

.parent-reading{
  display:none;

  margin-top:18px;

  padding:15px;

  border-radius:22px;

  background:#f4efe8;
}

body.parent-mode .parent-reading{
  display:block;
}

.parent-reading h3{
  margin:0 0 11px;

  font-size:17px;
}

.complete-read-btn{
  width:100%;

  min-height:55px;

  border:0;

  border-radius:18px;

  background:var(--green);

  color:var(--greenText);

  font-size:18px;

  font-weight:900;
}

.read-stats{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:10px;
}

.read-stat{
  padding:11px;

  border-radius:16px;

  background:#fff;

  text-align:center;
}

.read-stat strong{
  display:block;

  font-size:24px;
}

.read-stat span{
  color:var(--muted);

  font-size:12px;
}


/* =========================================================
   HISTORY
   ========================================================= */

.history-section{
  margin-top:15px;
}

.history-title{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:7px;

  font-size:14px;

  font-weight:900;
}

.history-empty{
  padding:13px;

  border-radius:14px;

  background:#fff;

  color:var(--muted);

  font-size:13px;
}

.history-list{
  display:flex;

  flex-direction:column;

  gap:6px;

  max-height:220px;

  overflow-y:auto;
}

.history-row{
  display:flex;

  align-items:center;

  gap:8px;

  padding:9px 10px;

  border-radius:13px;

  background:#fff;
}

.history-time{
  flex:1;

  min-width:0;

  font-size:13px;

  color:#735f51;
}

.delete-history-btn{
  flex:0 0 auto;

  min-height:34px;

  padding:5px 10px;

  border:0;

  border-radius:10px;

  background:var(--dangerSoft);

  color:var(--danger);

  font-size:12px;

  font-weight:900;
}


/* =========================================================
   PARENT ACTIONS
   ========================================================= */

.parent-actions{
  display:none;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:12px;
}

body.parent-mode .parent-actions{
  display:grid;
}

.edit-btn,
.delete-btn{
  min-height:50px;

  border:0;

  border-radius:16px;

  font-weight:900;
}

.edit-btn{
  background:#eee;
  color:#555;
}

.delete-btn{
  background:var(--dangerSoft);
  color:var(--danger);
}


/* =========================================================
   FORM
   ========================================================= */

.form-title{
  margin:0 0 14px;

  font-size:22px;
}

label{
  display:block;

  margin:
    12px
    2px
    5px;

  font-size:13px;

  font-weight:900;
}

input,
select,
textarea{
  width:100%;

  padding:13px;

  border:
    1px solid
    #ddd3c8;

  border-radius:13px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d9a875;
}

textarea{
  min-height:95px;

  resize:vertical;
}

.cover-preview{
  display:none;

  width:120px;
  height:160px;

  margin:12px auto;

  border-radius:8px;

  object-fit:cover;

  box-shadow:
    5px 8px 14px
    rgba(50,31,18,.2);
}

.cover-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:8px;
}

.small-btn{
  min-height:42px;

  border:0;

  border-radius:13px;

  background:#f1ece6;

  color:var(--text);

  font-size:13px;

  font-weight:800;
}

.form-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:18px;
}

.form-actions button{
  min-height:50px;

  border:0;

  border-radius:15px;

  font-weight:900;
}

.cancel-btn{
  background:#eee;
}

.save-btn{
  background:var(--orange);

  color:white;
}


/* =========================================================
   UNDO / TOAST
   ========================================================= */

.undo-toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      94px +
      env(safe-area-inset-bottom)
    );

  z-index:200;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  width:calc(100% - 28px);
  max-width:420px;

  padding:12px 14px;

  border-radius:18px;

  background:#493d35;

  color:#fff;

  transform:
    translateX(-50%)
    translateY(130px);

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.undo-toast.show{
  transform:
    translateX(-50%)
    translateY(0);

  opacity:1;

  pointer-events:auto;
}

.undo-toast button{
  flex:0 0 auto;

  padding:8px 12px;

  border:0;

  border-radius:999px;

  background:#fff;

  color:var(--text);

  font-weight:900;
}

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index:210;

  max-width:85vw;

  padding:11px 16px;

  border-radius:999px;

    translateY(35px);

}

.toast.show{

    translateY(0);

}


/* =========================================================
   SPARKLES
   ========================================================= */

.spark{

<script>

(function(){

"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

/*
  家長密碼。
  想改就在這裡改。
*/

const PARENT_PIN = "1234";


/*
  這個 KEY 故意沿用上一版。
  這樣你目前已經新增的書、
  封面、筆記、共讀紀錄
  可以繼續使用。
*/

const STORAGE_KEY =
  "jessie-bookshelf-v5";


const categoryNames = {

  story:"故事繪本",

  english:"英文繪本",

  sensory:"感官互動",

  cognitive:"認知",

  music:"兒歌",

  other:"其他"

};


const categoryIcons = {

  story:"📕",

  english:"🔤",

  sensory:"✋",

  cognitive:"🧠",

  music:"🎵",

  other:"📚"

};


const categoryOrder = [

  "story",

  "english",

  "sensory",

  "cognitive",

  "music",

  "other"

];


/* =========================================================
   STATE
   ========================================================= */

let books = [];

let selectedBookId = null;

let editingBookId = null;

let pendingCover = "";

let currentFilter = "all";

let searchKeyword = "";

let lastAddedReading = null;

let undoTimer = null;

let toastTimer = null;


/* =========================================================
   HELPERS
   ========================================================= */

function createId(prefix){

  return (

    prefix +

    "_" +

    Date.now()
      .toString(36) +

    "_" +

    Math.random()
      .toString(36)
      .slice(2,8)

  );

}


function localDateKey(timestamp){

  const date = timestamp
    ? new Date(timestamp)
    : new Date();


  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth()+1
    )
    .padStart(2,"0");


  const d =
    String(
      date.getDate()
    )
    .padStart(2,"0");


  return `${y}-${m}-${d}`;

}


function formatReadingTime(timestamp){

  if(!timestamp){

    return "舊版共讀紀錄";

  }


  const date =
    new Date(timestamp);


  const month =
    date.getMonth()+1;


  const day =
    date.getDate();


  const hours =
    String(
      date.getHours()
    )
    .padStart(2,"0");


  const minutes =
    String(
      date.getMinutes()
    )
    .padStart(2,"0");


  return (
    `${month}/${day} ${hours}:${minutes}`
  );

}


function getBook(id){

  return books.find(
    book => book.id === id
  );

}


/* =========================================================
   DEFAULT BOOKS
   ========================================================= */

function starterBook(
  title,
  category,
  age,
  emoji,
  status="now"
){

  return {

    id:createId("book"),

    title,

    category,

    age,

    readingStatus:status,

    cover:"",

    note:"",

    favorite:false,

    readingHistory:[],

    emoji,

    createdAt:Date.now()

  };

}


function getStarterBooks(){

  return [

    starterBook(
      "See, Touch, Feel",
      "sensory",
      "0–1歲",
      "🤲"
    ),

    starterBook(
      "Brown Bear, Brown Bear, What Do You See?",
      "english",
      "0歲+",
      "🐻"
    ),

    starterBook(
      "Dear Zoo",
      "english",
      "0歲+",
      "🦁"
    ),

    starterBook(
      "小藍和小黃",
      "story",
      "1歲+",
      "🔵"
    ),

    starterBook(
      "這是什麼聲音？交通",
      "sensory",
      "0歲+",
      "🚒"
    ),

    starterBook(
      "找一找彩色襪子在哪裡？",
      "cognitive",
      "0歲+",
      "🧦"
    ),

    starterBook(
      "找一找美味櫻桃在哪裡？",
      "cognitive",
      "0歲+",
      "🍒"
    ),

    starterBook(
      "小黃點遊戲盒",
      "other",
      "3–6歲",
      "🟡",
      "later"
    )

  ];

}


/* =========================================================
   STORAGE
   ========================================================= */

function loadBooks(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){

      books =
        getStarterBooks();

      return;

    }


    const parsed =
      JSON.parse(raw);


    if(!Array.isArray(parsed)){

      books =
        getStarterBooks();

      return;

    }


    books = parsed;

  }

  catch(error){

    books =
      getStarterBooks();

  }

}


function normalizeBooks(){

  books.forEach(book=>{

    if(!book.id){

      book.id =
        createId("book");

    }


    if(!book.title){

      book.title =
        "未命名書籍";

    }


    if(!book.category){

      book.category =
        "other";

    }


    if(!book.readingStatus){

      book.readingStatus =
        "now";

    }


    if(
      typeof book.favorite !==
      "boolean"
    ){

      book.favorite =
        false;

    }


    if(
      !Array.isArray(
        book.readingHistory
      )
    ){

      book.readingHistory = [];


      const oldCount =
        Number(
          book.readCount
        ) || 0;


      for(
        let i=0;
        i<oldCount;
        i++
      ){

        book.readingHistory.push({

          id:createId("legacy"),

          timestamp:null,

          legacy:true

        });

      }

    }


    book.readingHistory.forEach(
      record=>{

        if(!record.id){

          record.id =
            createId("read");

        }

      }
    );


    delete book.readCount;

  });

}


function persistBooks(){

  try{

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(books)

    );

    return true;

  }

  catch(error){

    showToast(
      "儲存空間不足。請先匯出備份，或使用較小的封面照片。"
    );

    return false;

  }

}


function saveAndRefresh(){

  if(!persistBooks()){

    return false;

  }


  renderEverything();

  return true;

}


/* =========================================================
   READ STATS
   ========================================================= */

function totalReads(book){

  return (
    book.readingHistory ||
    []
  ).length;

}


function todayReads(book){

  const today =
    localDateKey();


  return (
    book.readingHistory ||
    []
  )
  .filter(record=>{

    if(!record.timestamp){

      return false;

    }


    return (
      localDateKey(
        record.timestamp
      ) === today
    );

  })
  .length;

}


function getTodayBooks(){

  const results = [];


  books.forEach(book=>{

    const count =
      todayReads(book);


    if(count>0){

      results.push({

        book,

        count

      });

    }

  });


  return results;

}


/* =========================================================
   GLOBAL STATS
   ========================================================= */

function renderStats(){

  const total =
    books.reduce(

      (sum,book)=>
        sum + totalReads(book),

      0

    );


  document
    .getElementById(
      "globalStats"
    )
    .textContent =

    `${books.length} 本小書 · 累積共讀 ${total} 次`;

}


/* =========================================================
   TODAY
   ========================================================= */

function renderToday(){

  const container =
    document.getElementById(
      "todayContent"
    );


  const totalEl =
    document.getElementById(
      "todayTotal"
    );


  container
    .replaceChildren();


  const items =
    getTodayBooks();


  const total =
    items.reduce(

      (sum,item)=>
        sum + item.count,

      0

    );


  totalEl.textContent =
    `${total} 次`;


  if(items.length===0){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "today-empty";


    empty.textContent =
      "今天還沒有共讀紀錄，選一本開始吧 ♡";


    container.appendChild(
      empty
    );

    return;

  }


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "today-list";


  items.forEach(item=>{

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "today-row";


    const icon =
      document.createElement(
        "span"
      );


    icon.className =
      "today-book-icon";


    icon.textContent =
      "📖";


    const name =
      document.createElement(
        "span"
      );


    name.className =
      "today-book-name";


    name.textContent =
      item.book.title;


    const count =
      document.createElement(
        "span"
      );


    count.className =
      "today-count";


    count.textContent =
      `× ${item.count}`;


    row.append(
      icon,
      name,
      count
    );


    list.appendChild(row);

  });


  container.appendChild(list);

}


/* =========================================================
   FILTERING
   ========================================================= */

function matchesFilter(book){

  const keyword =
    searchKeyword
      .trim()
      .toLowerCase();


  if(
    keyword &&
    !book.title
      .toLowerCase()
      .includes(keyword)
  ){

    return false;

  }


  switch(currentFilter){

    case "all":
      return true;

    case "favorite":
      return book.favorite;

    case "now":
      return (
        book.readingStatus ===
        "now"
      );

    case "later":
      return (
        book.readingStatus ===
        "later"
      );

    case "story":
    case "english":
    case "sensory":
    case "cognitive":
    case "music":
      return (
        book.category ===
        currentFilter
      );

    default:
      return true;

  }

}


/* =========================================================
   BOOK COVER
   ========================================================= */

function createBookCover(book){

  const object =
    document.createElement(
      "div"
    );


  object.className =
    "book-object";


  const cover =
    document.createElement(
      "div"
    );


  cover.className =
    "book-cover";


  if(book.cover){

    const image =
      document.createElement(
        "img"
      );


    image.src =
      book.cover;


    image.alt =
      `${book.title} 封面`;


    cover.appendChild(
      image
    );

  }

  else{

    const placeholder =
      document.createElement(
        "div"
      );


    placeholder.className =
      "placeholder-cover";


    const icon =
      document.createElement(
        "div"
      );


    icon.className =
      "placeholder-icon";


    icon.textContent =
      book.emoji || "📖";


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "placeholder-title";


    title.textContent =
      book.title;


    placeholder.append(
      icon,
      title
    );


    cover.appendChild(
      placeholder
    );

  }


  const gloss =
    document.createElement(
      "div"
    );


  gloss.className =
    "book-gloss";


  cover.appendChild(
    gloss
  );


  object.appendChild(
    cover
  );


  return object;

}


/* =========================================================
   BOOK ITEM
   ========================================================= */

function createBookElement(book){

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "book-item";


  button.dataset.bookId =
    book.id;


  button.setAttribute(
    "aria-label",
    `打開 ${book.title}`
  );


  button.appendChild(
    createBookCover(book)
  );


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "book-label";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "book-name";


  name.textContent =
    book.title;


  label.appendChild(
    name
  );


  if(book.favorite){

    const favorite =
      document.createElement(
        "div"
      );


    favorite.className =

/* =========================================================
   CENTER BOOK CALCULATION

   不再使用 IntersectionObserver。
   直接計算每本書中心距離螢幕中心多少。
   ========================================================= */

function updateCenteredBook(row){

  const booksInRow =
    Array.from(
      row.querySelectorAll(
        ".book-item"
      )
    );


  if(!booksInRow.length){

    return;

  }


  const rowRect =
    row.getBoundingClientRect();


  const centerX =
    rowRect.left +
    rowRect.width / 2;


  let closest = null;

  let closestDistance =
    Infinity;


  booksInRow.forEach(book=>{

    const rect =
      book.getBoundingClientRect();


    const bookCenter =
      rect.left +
      rect.width / 2;


    const distance =
      Math.abs(
        bookCenter - centerX
      );


    book.classList.remove(
      "center-book"
    );


    if(
      distance <
      closestDistance
    ){

      closestDistance =
        distance;

      closest =
        book;

    }

  });


  if(closest){

    closest.classList.add(
      "center-book"
    );

  }

}


function activateRowCentering(row){

  let ticking = false;


  const update = ()=>{

    updateCenteredBook(row);

    ticking = false;

  };


  row.addEventListener(
    "scroll",
    ()=>{

      if(ticking){

        return;

      }


      ticking = true;


      requestAnimationFrame(
        update
      );

    },
    {
      passive:true
    }
  );


  window.addEventListener(
    "resize",
    ()=>updateCenteredBook(row)
  );


  requestAnimationFrame(
    ()=>updateCenteredBook(row)
  );

}

/* =========================================================

   ========================================================= */

function renderReadingHistory(book){

  const list =
    document.getElementById(
      "historyList"
    );


  const count =
    document.getElementById(
      "historyCount"
    );


  list.replaceChildren();


  const history =
    [
      ...(book.readingHistory || [])
    ]
    .sort((a,b)=>{

      const ta =
        a.timestamp || 0;

      const tb =
        b.timestamp || 0;

      return tb-ta;

    });


  count.textContent =
    `${history.length} 筆`;


  if(!history.length){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "history-empty";


    empty.textContent =
      "還沒有共讀紀錄。";


    list.appendChild(
      empty
    );

    return;

  }


  history.forEach(
    record=>{

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "history-row";


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "history-time";


      time.textContent =
        "📖 " +
        formatReadingTime(
          record.timestamp
        );


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "delete-history-btn";


      remove.textContent =
        "刪除";


      remove.addEventListener(
        "click",
        ()=>{

          const ok =
            confirm(
              "確定刪除這一次共讀紀錄嗎？"
            );


          if(!ok){

            return;

          }


          book.readingHistory =
            book.readingHistory.filter(
              item=>
                item.id !==
                record.id
            );


          saveAndRefresh();

          renderBookDetail(
            book
          );


          showToast(
            "這次共讀紀錄已刪除"
          );

        }
      );


      row.append(
        time,
        remove
      );


      list.appendChild(
        row
      );

    }
  );

}

/* =========================================================
   COMPRESS IMAGE

   壓成 WebP / JPEG，
   降低 localStorage 爆掉的機率。
   ========================================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onerror =
        reject;


      reader.onload =
        ()=>{

          const image =
            new Image();


          image.onerror =
            reject;


          image.onload =
            ()=>{

              const maxWidth =
                700;


              const maxHeight =
                950;


              const scale =
                Math.min(

                  1,

                  maxWidth /
                  image.width,

                  maxHeight /
                  image.height

                );


              const width =
                Math.max(
                  1,
                  Math.round(
                    image.width *
                    scale
                  )
                );


              const height =
                Math.max(
                  1,
                  Math.round(
                    image.height *
                    scale
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.fillStyle =
                "#ffffff";


              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              let result;


              try{

                result =
                  canvas.toDataURL(
                    "image/webp",
                    .72
                  );

              }

              catch(error){

                result =
                  canvas.toDataURL(
                    "image/jpeg",
                    .72
                  );

              }


              resolve(result);

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

      }


      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          try{

            const parsed =
              JSON.parse(
                reader.result
              );


            /*
              支援：
              1. 新版 {books:[...]}
              2. 舊版直接 [...]
            */

            const imported =
              Array.isArray(parsed)

                ? parsed

                : parsed.books;


            if(
              !Array.isArray(
                imported
              )
            ){

              throw new Error(
                "invalid"
              );

            }


            const valid =
              imported.every(
                book=>
                  book &&
                  typeof book.title ===
                  "string"
              );


            if(!valid){

              throw new Error(
                "invalid"
              );

            }


            const ok =
              confirm(
                "匯入備份會取代目前的書櫃，確定嗎？"
              );


            if(!ok){

              return;

            }


            books =
              imported;


            normalizeBooks();

            saveAndRefresh();


            showToast(
              "備份已成功匯入"
            );

          }

          catch(error){

            showToast(
              "這不是有效的 Jessie 書櫃備份。"
            );

          }


          this.value =
            "";

        };


      reader.readAsText(
        file
      );

    }
  );


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{

        toast.classList.remove(
          "show"
        );

      },
      1900
    );

}


/* =========================================================
   SPARKLES
   ========================================================= */

function sparkle(){

  const symbols =
    [
      "⭐",
      "✨",
      "♡",
      "📖",
      "⭐"
    ];


  symbols.forEach(
    (symbol,index)=>{

      const el =
        document.createElement(
          "span"
        );


      el.className =
        "spark";


      el.textContent =
        symbol;


      el.style.left =
        (
          35 +
          Math.random()*30
        ) +
        "vw";


      el.style.top =
        (
          55 +
          Math.random()*10
        ) +
        "vh";


      el.style.animationDelay =
        (
          index*.04
        ) +
        "s";


      document.body.appendChild(
        el
      );


      setTimeout(
        ()=>el.remove(),
        1000
      );

    }
  );

}


/* =========================================================
   INIT
   ========================================================= */

loadBooks();

normalizeBooks();

persistBooks();

renderEverything();


})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">

<title>Jessie 的小圖書館</title>

<style>
:root{
  --bg:#faf9f6;
  --card:#ffffff;
  --text:#2f2b28;
  --muted:#9b948d;
  --line:#ebe7e2;
  --soft:#f2eee9;
  --accent:#d98d59;
  --green:#74866c;
  --danger:#b95c5c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

img{
  display:block;
}

/* =========================
   APP
========================= */

.app{
  width:min(100%,760px);
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  padding:
    calc(26px + env(safe-area-inset-top))
    20px
    14px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.title-wrap{
  min-width:0;
}

h1{
  margin:0;
  font-size:30px;
  line-height:1.15;
  letter-spacing:-1px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.stats{
  flex:0 0 auto;
  padding:8px 11px;
  border-radius:999px;
  background:var(--soft);
  color:#756e68;
  font-size:12px;
  font-weight:750;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
  padding:0 20px 16px;
}

.search{
  position:relative;
}

.search span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#9b948d;
}

.search input{
  width:100%;
  height:48px;
  padding:0 42px;

  border:1px solid var(--line);
  border-radius:16px;
  outline:none;

  background:#fff;
  color:var(--text);

  font-size:15px;
}

.search input:focus{
  border-color:#cfc6bd;
}

/* =========================
   TODAY
========================= */

.today{
  margin:0 20px 22px;
  padding:16px;

  border:1px solid var(--line);
  border-radius:20px;

  background:#fff;
}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-heading h2{
  margin:0;
  font-size:17px;
  font-weight:900;
}

.section-count{
  color:var(--muted);
  font-size:12px;
}

.today-books{
  display:flex;
  gap:12px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.today-books::-webkit-scrollbar{
  display:none;
}

.today-book{
  flex:0 0 76px;

  padding:0;
  border:0;
  background:transparent;

  color:var(--text);
  text-align:left;
}

.today-cover{
  width:76px;
  height:96px;

  overflow:hidden;

  border-radius:7px;
  background:var(--soft);
}

.today-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.today-title{
  margin-top:6px;

  overflow:hidden;

  font-size:11px;
  line-height:1.3;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.today-read-count{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.today-empty{
  margin-top:10px;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   FILTER
========================= */

.filters{
  display:flex;
  gap:7px;

  padding:0 20px 18px;

  overflow-x:auto;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  min-height:36px;
  padding:0 13px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#fff;
  color:#716a64;

  font-size:12px;
  font-weight:800;
}

.filter.active{
  border-color:var(--text);
  background:var(--text);
  color:white;
}

/* =========================
   LIBRARY
========================= */

.library{
  padding:0 20px;
}

.library-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;

  margin-bottom:15px;
}

.library-heading h2{
  margin:0;
  font-size:21px;
  font-weight:900;
}

.library-heading span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   GRID
========================= */

.book-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:24px 15px;
}

.book-card{
  min-width:0;

  padding:0;
  border:0;

  background:transparent;
  color:var(--text);

  text-align:left;
}

.cover{
  position:relative;

  width:100%;
  aspect-ratio:3/4;

  overflow:hidden;

  border-radius:8px;
  background:#eeeae5;

  box-shadow:
    0 5px 14px rgba(45,35,27,.08);
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:15px;

  background:#eee9e3;
  color:#80776f;

  text-align:center;
}

.cover-placeholder span{
  margin-bottom:8px;
  font-size:26px;
}

.favorite{
  position:absolute;
  top:7px;
  right:7px;

  display:grid;
  place-items:center;

  width:29px;
  height:29px;

  border-radius:50%;

  background:rgba(255,255,255,.91);

  font-size:14px;
}

.book-title{
  margin-top:9px;

  overflow:hidden;

  font-size:14px;
  font-weight:850;
  line-height:1.35;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.book-info{
  display:flex;
  flex-wrap:wrap;
  gap:5px;

  margin-top:6px;
}

.tag{
  padding:4px 7px;

  border-radius:999px;

  background:var(--soft);
  color:#776f68;

  font-size:10px;
  font-weight:700;
}

.no-results{
  grid-column:1/-1;

  padding:50px 20px;

  color:var(--muted);
  text-align:center;
}

/* =========================
   DIALOG
========================= */

dialog{
  width:min(94vw,440px);
  max-height:92dvh;

  margin:auto;
  padding:0;

  overflow:auto;

  border:0;
  border-radius:26px;

  background:#fff;
  color:var(--text);

  box-shadow:
    0 25px 80px rgba(0,0,0,.28);
}

dialog::backdrop{
  background:rgba(30,27,24,.55);
  backdrop-filter:blur(4px);
}

.modal{
  padding:18px;
}

.close{
  position:sticky;
  top:0;
  z-index:20;

  display:grid;
  place-items:center;

  width:43px;
  height:43px;

  margin-left:auto;

  border:0;
  border-radius:50%;

  background:#f2efeb;
  color:#5c554f;

  font-size:23px;
}

/* =========================
   DETAIL
========================= */

.detail-photo-wrap{
  min-height:280px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 18px 12px;
}

/*
  去背實體書：
  contain，不裁掉書本
*/

.detail-photo{
  display:block;

  width:auto;
  max-width:100%;
  height:auto;
  max-height:340px;

  object-fit:contain;

  filter:
    drop-shadow(0 15px 13px rgba(42,31,23,.17));
}

.detail-fallback{
  width:190px;
  aspect-ratio:3/4;

  overflow:hidden;

  border-radius:8px;
  background:#eee;

  box-shadow:
    0 14px 25px rgba(45,35,27,.16);
}

.detail-fallback img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-title{
  margin:5px 5px 12px;

  font-size:24px;
  line-height:1.25;
  text-align:center;
}

.detail-tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
}

.detail-tag{
  padding:7px 10px;

  border-radius:999px;

  background:var(--soft);

  color:#6d655f;

  font-size:12px;
  font-weight:800;
}

.detail-tag.now{
  background:#e9f0e5;
  color:#617359;
}

.read-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:17px;
}

.read-stat{
  padding:13px;

  border-radius:17px;

  background:#f8f5f1;

  text-align:center;
}

.read-stat strong{
  display:block;
  font-size:25px;
}

.read-stat span{
  color:var(--muted);
  font-size:11px;
}

.read-btn{
  width:100%;
  min-height:58px;

  margin-top:10px;

  border:0;
  border-radius:18px;

  background:var(--text);
  color:white;

  font-size:17px;
  font-weight:900;
}

.read-btn.done{
  background:var(--green);
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:8px;
}

.detail-actions button{
  min-height:46px;

  border:1px solid var(--line);
  border-radius:15px;

  background:#fff;
  color:#625b55;

  font-size:12px;
  font-weight:850;
}

.note{
  display:none;

  margin-top:14px;
  padding:14px;

  border-radius:17px;

  background:#f8f5f1;

  line-height:1.55;
  font-size:13px;
}

body.parent .note{
  display:block;
}

.parent-actions{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:8px;
}

body.parent .parent-actions{
  display:grid;
}

.parent-actions button{
  min-height:46px;

  border:0;
  border-radius:15px;

  font-weight:850;
}

.edit-btn{
  background:#eeeae6;
  color:#5f5852;
}

.delete-btn{
  background:#f9e5e5;
  color:var(--danger);
}

/* =========================
   HISTORY
========================= */

.history-list{
  display:flex;
  flex-direction:column;
  gap:7px;

  margin-top:13px;
}

.history-row{
  display:flex;
  align-items:center;
  gap:8px;

  padding:11px;

  border-radius:13px;

  background:#f7f4f0;
}

.history-time{
  flex:1;
  font-size:13px;
}

.history-delete{
  display:none;

  padding:6px 9px;

  border:0;
  border-radius:9px;

  background:#f7dddd;
  color:var(--danger);

  font-size:11px;
  font-weight:800;
}

body.parent .history-delete{
  display:block;
}

/* =========================
   FORM
========================= */

.form-title{
  margin:0 0 18px;
}

label{
  display:block;

  margin:12px 2px 5px;

  font-size:12px;
  font-weight:850;
}

input,
select,
textarea{
  width:100%;

  padding:12px;

  border:1px solid #ddd7d1;
  border-radius:12px;

  outline:none;

  background:#fff;
  color:var(--text);

  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.form-help{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
  line-height:1.4;
}

.upload-preview{
  display:none;

  max-width:150px;
  max-height:180px;

  margin:10px auto;

  object-fit:contain;
}

.cover-search-btn{
  width:100%;
  min-height:45px;

  margin-top:7px;

  border:0;
  border-radius:13px;

  background:#efebe6;
  color:#5f5852;

  font-size:12px;
  font-weight:850;
}

.cover-results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;

  margin-top:9px;
}

.cover-choice{
  padding:0;

  overflow:hidden;

  border:2px solid transparent;
  border-radius:7px;

  background:#eee;
}

.cover-choice.selected{
  border-color:#777;
}

.cover-choice img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
}

.search-message{
  margin-top:7px;

  color:var(--muted);

  font-size:11px;
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:18px;
}

.form-actions button{
  min-height:48px;

  border:0;
  border-radius:14px;

  font-weight:900;
}

.cancel{
  background:#eeeae6;
}

.save{
  background:var(--text);
  color:white;
}

/* =========================
   PARENT
========================= */

.parent-tools{
  display:none;

  grid-template-columns:repeat(3,1fr);
  gap:7px;

  padding:22px 20px 0;
}

body.parent .parent-tools{
  display:grid;
}

.parent-tools button{
  min-height:45px;

  padding:7px;

  border:1px solid var(--line);
  border-radius:13px;

  background:#fff;
  color:#655e58;

  font-size:11px;
  font-weight:800;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  position:fixed;
  z-index:50;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;

  padding:
    25px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      var(--bg) 42%
    );

  pointer-events:none;
}

#parentBtn{
  pointer-events:auto;

  min-height:48px;
  padding:0 19px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#fff;
  color:#655e58;

  font-size:12px;
  font-weight:850;

  box-shadow:
    0 6px 18px rgba(40,32,25,.08);
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:200;

  left:50%;
  bottom:calc(87px + env(safe-area-inset-bottom));

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  width:calc(100% - 30px);
  max-width:400px;

  padding:12px 14px;

  border-radius:15px;

  background:#332f2c;
  color:white;

  opacity:0;
  transform:translate(-50%,25px);

  pointer-events:none;

  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
  pointer-events:auto;
}

.toast button{
  padding:6px 10px;

  border:0;
  border-radius:999px;

  background:white;
  color:#332f2c;

  font-weight:850;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:600px){

  .app{
    width:min(100%,900px);
  }

  .book-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:28px 20px;
  }

  header,
  .search-wrap,
  .filters,
  .library,
  .parent-tools{
    padding-left:28px;
    padding-right:28px;
  }

  .today{
    margin-left:28px;
    margin-right:28px;
  }
}

@media(min-width:850px){

  .book-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-top">

    <div class="title-wrap">
      <h1>Jessie 的小圖書館</h1>
      <div class="subtitle">
        閱讀，陪你長大的每一天 ♡
      </div>
    </div>

    <div class="stats" id="stats"></div>

  </div>

</header>

<section class="search-wrap">

  <div class="search">

    <span>⌕</span>

    <input
      id="searchInput"
      type="search"
      placeholder="搜尋書名"
    >

  </div>

</section>

<section class="today">

  <div class="section-heading">

    <h2>今天的共讀</h2>

    <span
      class="section-count"
      id="todayTotal"
    >
      0 次
    </span>

  </div>

  <div id="todayContent"></div>

</section>

<nav
  class="filters"
  id="filters"
></nav>

<main class="library">

  <div class="library-heading">

    <h2 id="libraryTitle">
      全部藏書
    </h2>

    <span id="resultCount"></span>

  </div>

  <div
    class="book-grid"
    id="bookGrid"
  ></div>

</main>

<section class="parent-tools">

  <button id="addBookBtn">
    ＋ 新增
  </button>

  <button id="exportBtn">
    ⇩ 備份
  </button>

  <button id="importBtn">
    ⇧ 匯入
  </button>

  <input
    id="importFile"
    type="file"
    accept="application/json"
    hidden
  >

</section>

</div>

<div class="bottom">

  <button id="parentBtn">
    🔒 家長模式
  </button>

</div>

<!-- DETAIL -->

<dialog id="detailDialog">

<div class="modal">

  <button
    class="close"
    id="closeDetail"
  >
    ×
  </button>

  <div
    class="detail-photo-wrap"
    id="detailPhotoWrap"
  ></div>

  <h2
    class="detail-title"
    id="detailTitle"
  ></h2>

  <div class="detail-tags">

    <span
      class="detail-tag"
      id="detailCategory"
    ></span>

    <span
      class="detail-tag"
      id="detailAge"
    ></span>

    <span
      class="detail-tag"
      id="detailStatus"
    ></span>

  </div>

  <div class="read-stats">

    <div class="read-stat">

      <strong id="todayBookCount">
        0
      </strong>

      <span>今天</span>

    </div>

    <div class="read-stat">

      <strong id="totalBookCount">
        0
      </strong>

      <span>累積共讀</span>

    </div>

  </div>

  <button
    class="read-btn"
    id="readBtn"
  >
    📖 完成一次共讀
  </button>

  <div class="detail-actions">

    <button id="favoriteBtn">
      ♡ 收藏
    </button>

    <button id="historyBtn">
      共讀紀錄
    </button>

  </div>

  <div class="note">

    <strong>媽媽的筆記</strong>

    <div
      id="detailNote"
      style="margin-top:6px"
    ></div>

  </div>

  <div class="parent-actions">

    <button
      class="edit-btn"
      id="editBtn"
    >
      編輯
    </button>

    <button
      class="delete-btn"
      id="deleteBtn"
    >
      刪除
    </button>

  </div>

</div>

</dialog>

<!-- HISTORY -->

<dialog id="historyDialog">

<div class="modal">

  <button
    class="close"
    id="closeHistory"
  >
    ×
  </button>

  <h2 style="margin-top:0">
    共讀紀錄
  </h2>

  <div
    id="historyBookName"
    style="color:var(--muted);font-size:13px"
  ></div>

  <div
    class="history-list"
    id="historyList"
  ></div>

</div>

</dialog>

<!-- EDIT -->

<dialog id="editDialog">

<form
  class="modal"
  id="bookForm"
>

  <h2
    class="form-title"
    id="formTitle"
  >
    新增書籍
  </h2>

  <label>
    書名 *
  </label>

  <input
    id="bookTitle"
    required
    placeholder="書名"
  >

  <label>
    封面
  </label>

  <button
    type="button"
    class="cover-search-btn"
    id="onlineCoverBtn"
  >
    搜尋網路封面
  </button>

  <div
    class="search-message"
    id="coverSearchMessage"
  ></div>

  <div
    class="cover-results"
    id="coverResults"
  ></div>

  <input
    id="coverFile"
    type="file"
    accept="image/*"
  >

  <img
    class="upload-preview"
    id="coverPreview"
  >

  <label>
    實體書去背照
  </label>

  <input
    id="bookPhotoFile"
    type="file"
    accept="image/png,image/webp,image/jpeg"
  >

  <div class="form-help">
    點進書籍後顯示。建議使用透明背景 PNG；沒有照片時會自動使用封面。
  </div>

  <img
    class="upload-preview"
    id="bookPhotoPreview"
  >

  <label>
    分類
  </label>

  <select id="bookCategory">

    <option value="story">
      故事繪本
    </option>

    <option value="english">
      英文繪本
    </option>

    <option value="sensory">
      感官・互動
    </option>

    <option value="readalong">
      點讀・有聲
    </option>

    <option value="cognitive">
      認知探索
    </option>

    <option value="music">
      兒歌・音樂
    </option>

    <option value="other">
      其他
    </option>

  <label>
    適讀年齡
  </label>

    id="bookAge"
    placeholder="例如 6M+、0–3歲"

  <label>
    閱讀階段
  </label>

  <select id="bookStatus">

    <option value="now">
      現在適合
    </option>

    <option value="later">
      長大再讀
    </option>

  </select>

  <label>
    媽媽的筆記
  </label>

  <textarea
    id="bookNote"
    placeholder="Jessie 喜歡什麼？怎麼一起讀？"
  ></textarea>

    <button
      type="button"

>

    復原

</div>

<script>
(()=>{
"use strict";

/* ==================================
   CONFIG
================================== */

const STORAGE_KEY="jessie-bookshelf-v5";
const PIN="1234";

const categories=[
  {
    id:"all",
    name:"全部"
  },
  {
    id:"story",
    name:"故事"
  },
  {
    id:"english",
    name:"英文"
  },
  {
    id:"sensory",
    name:"感官"
  },
  {
    id:"readalong",
    name:"點讀"
  },
  {
    id:"cognitive",
    name:"認知"
  },
  {
    id:"music",
    name:"兒歌"
  },
  {
    id:"favorite",
    name:"♡ 最愛"
  },
  {
    id:"later",
    name:"長大再讀"
  }
];

const categoryNames={
  story:"故事繪本",
  english:"英文繪本",
  sensory:"感官・互動",
  readalong:"點讀・有聲",
  cognitive:"認知探索",
  music:"兒歌・音樂",
  other:"其他"
};

let books=[];

let selectedId=null;
let editingId=null;

let currentFilter="all";
let keyword="";

let pendingCover="";
let pendingBookPhoto="";

let lastReading=null;
let readLocked=false;

let toastTimer=null;

const $=id=>document.getElementById(id);

/* ==================================
   HELPERS
================================== */

function makeId(prefix="id"){

  return (
    prefix+"_"+
    Date.now().toString(36)+"_"+
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}

function getBook(id){

  return books.find(
    book=>book.id===id
  );
}

function dayKey(timestamp=Date.now()){

  const date=new Date(timestamp);

  return [
    date.getFullYear(),
    String(
      date.getMonth()+1
    ).padStart(2,"0"),
    String(
      date.getDate()
    ).padStart(2,"0")
  ].join("-");
}

function totalReads(book){

  return (
    book.readingHistory||[]
  ).length;
}

function todayReads(book){

  const today=dayKey();

  return (
    book.readingHistory||[]
  ).filter(record=>{

    if(record.dateKey){
      return record.dateKey===today;
    }

    if(record.timestamp){
      return (
        dayKey(record.timestamp)===
        today
      );
    }

    return false;

  }).length;
}

function formatTime(timestamp){

  if(!timestamp){
    return "舊版共讀紀錄";
  }

  const date=new Date(timestamp);

  return (
    `${date.getFullYear()}/`+
    `${date.getMonth()+1}/`+
    `${date.getDate()} `+
    `${String(date.getHours()).padStart(2,"0")}:`+
    `${String(date.getMinutes()).padStart(2,"0")}`
  );
}

/* ==================================
   STORAGE
================================== */

function load(){

  try{

    const raw=
      localStorage.getItem(
        STORAGE_KEY
      );

    books=
      raw
        ?JSON.parse(raw)
        :[];

    if(!Array.isArray(books)){
      books=[];
    }

  }catch{

    books=[];
  }

  books.forEach(book=>{

    if(!book.id){
      book.id=makeId("book");
    }

    if(!book.category){
      book.category="other";
    }

    if(!book.readingStatus){
      book.readingStatus="now";
    }

    if(
      typeof book.favorite!==
      "boolean"
    ){
      book.favorite=false;
    }

    /*
      新欄位：
      實體書去背照
    */

    if(
      typeof book.bookPhoto!==
      "string"
    ){
      book.bookPhoto="";
    }

    if(
      !Array.isArray(
        book.readingHistory
      )
    ){

      book.readingHistory=[];

      /*
        舊 readCount 僅轉為
        legacy 紀錄，
        不計入「今天」
      */

      const old=
        Number(book.readCount)||0;

      for(
        let i=0;
        i<old;
        i++
      ){

        book.readingHistory.push({
          id:makeId("legacy"),
          timestamp:null,
          legacy:true
        });
      }
    }

    book.readingHistory
      .forEach(record=>{

        if(!record.id){
          record.id=
            makeId("read");
        }
      });
  });

  save();
}

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(books)
    );

    return true;

  }catch{

    alert(
      "瀏覽器儲存空間不足。\n\n"+
      "照片會佔較多空間，"+
      "建議先匯出備份。"
    );

    return false;
  }
}

/* ==================================
   STATS
================================== */

function renderStats(){

  const reads=
    books.reduce(
      (sum,book)=>
        sum+totalReads(book),
      0
    );

  $("stats").textContent=
    `${books.length} 本 · ${reads} 次`;
}

/* ==================================
   FILTERS
================================== */

function renderFilters(){

  $("filters").innerHTML="";

  categories.forEach(category=>{

    const button=
      document.createElement(
        "button"
      );

    button.className="filter";

    if(
      category.id===
      currentFilter
    ){
      button.classList.add(
        "active"
      );
    }

    button.textContent=
      category.name;

    button.onclick=()=>{

      currentFilter=
        category.id;

      renderFilters();
      renderBooks();
    };

    $("filters")
      .appendChild(button);
  });
}

/* ==================================
   FILTER DATA
================================== */

function filteredBooks(){

  let list=[...books];

  if(currentFilter==="favorite"){

    list=list.filter(
      book=>book.favorite
    );

  }else if(
    currentFilter==="later"
  ){

    list=list.filter(
      book=>
        book.readingStatus===
        "later"
    );

  }else if(
    currentFilter!=="all"
  ){

    list=list.filter(
      book=>
        book.category===
        currentFilter &&
        book.readingStatus!==
        "later"
    );

  }else{

    /*
      全部：
      仍然顯示所有收藏，
      包括長大再讀。
    */
  }

  if(keyword){

    const key=
      keyword.toLowerCase();

    list=list.filter(book=>
      (book.title||"")
        .toLowerCase()
        .includes(key) ||
      (book.note||"")
        .toLowerCase()
        .includes(key)
    );
  }

  return list;
}

/* ==================================
   COVER ELEMENT
================================== */

function createCoverContent(
  book,
  className="cover"
){

  const container=
    document.createElement(
      "div"
    );

  container.className=
    className;

  if(book.cover){

    const image=
      document.createElement(
        "img"
      );

    image.src=book.cover;
    image.alt=book.title;

    container.appendChild(
      image
    );

  }else{

    const placeholder=
      document.createElement(
        "div"
      );

    placeholder.className=
      "cover-placeholder";

    const icon=
      document.createElement(
        "span"
      );

    icon.textContent="📖";

    const title=
      document.createElement(
        "div"
      );

    title.textContent=
      book.title;

    placeholder.append(
      icon,
      title
    );

    container.appendChild(
      placeholder
    );
  }

  return container;
}

/* ==================================
   TODAY
================================== */

function renderToday(){

  $("todayContent").innerHTML="";

  const todayBooks=
    books
      .map(book=>({
        book,
        count:todayReads(book)
      }))
      .filter(
        item=>item.count>0
      );

  const total=
    todayBooks.reduce(
      (sum,item)=>
        sum+item.count,
      0
    );

  $("todayTotal").textContent=
    `${total} 次`;

  if(!todayBooks.length){

    const empty=
      document.createElement(
        "div"
      );

    empty.className=
      "today-empty";

    empty.textContent=
      "今天還沒有共讀紀錄";

    $("todayContent")
      .appendChild(empty);

    return;
  }

  const row=
    document.createElement(
      "div"
    );

  row.className=
    "today-books";

  todayBooks.forEach(
    ({book,count})=>{

      const button=
        document.createElement(
          "button"
        );

      button.className=
        "today-book";

      const cover=
        createCoverContent(
          book,
          "today-cover"
        );

      const title=
        document.createElement(
          "div"
        );

      title.className=
        "today-title";

      title.textContent=
        book.title;

      const amount=
        document.createElement(
          "div"
        );

      amount.className=
        "today-read-count";

      amount.textContent=
        `${count} 次`;

      button.append(
        cover,
        title,
        amount
      );

      button.onclick=()=>{
        openBook(book.id);
      };

      row.appendChild(
        button
      );
    }
  );

  $("todayContent")
    .appendChild(row);
}

/* ==================================
   BOOK GRID
================================== */

function createBookCard(book){

  const button=
    document.createElement(
      "button"
    );

  button.className=
    "book-card";

  const cover=
    createCoverContent(book);

  if(book.favorite){

    const favorite=
      document.createElement(
        "span"
      );

    favorite.className=
      "favorite";

    favorite.textContent="♥";

    cover.appendChild(
      favorite
    );
  }

  const title=
    document.createElement(
      "div"
    );

  title.className=
    "book-title";

  title.textContent=
    book.title;

  const info=
    document.createElement(
      "div"
    );

  info.className=
    "book-info";

  if(book.age){

    const age=
      document.createElement(
        "span"
      );

    age.className="tag";
    age.textContent=book.age;

    info.appendChild(age);
  }

  if(
    book.readingStatus===
    "later"
  ){

    const later=
      document.createElement(
        "span"
      );

    later.className="tag";
    later.textContent=
      "長大再讀";

    info.appendChild(later);
  }

  const reads=
    totalReads(book);

  if(reads){

    const readTag=
      document.createElement(
        "span"
      );

    readTag.className="tag";

    readTag.textContent=
      `${reads} 次`;

    info.appendChild(
      readTag
    );
  }

  button.append(
    cover,
    title,
    info
  );

  button.onclick=()=>{
    openBook(book.id);
  };

  return button;
}

function renderBooks(){

  const list=
    filteredBooks();

  $("bookGrid").innerHTML="";

  let title="全部藏書";

  const current=
    categories.find(
      category=>
        category.id===
        currentFilter
    );

  if(
    current &&
    currentFilter!=="all"
  ){
    title=current.name;
  }

  if(keyword){
    title=`搜尋「${keyword}」`;
  }

  $("libraryTitle")
    .textContent=title;

  $("resultCount")
    .textContent=
      `${list.length} 本`;

  if(!list.length){

    const empty=
      document.createElement(
        "div"
      );

    empty.className=
      "no-results";

    empty.textContent=
      "這裡目前沒有書";

    $("bookGrid")
      .appendChild(empty);

    return;
  }

  list.forEach(book=>{

    $("bookGrid")
      .appendChild(
        createBookCard(book)
      );
  });
}

/* ==================================
   SEARCH
================================== */

$("searchInput")
  .addEventListener(
    "input",
    event=>{

      keyword=
        event.target.value.trim();

      renderBooks();
    }
  );

/* ==================================
   DETAIL
================================== */

function renderDetail(book){

  $("detailPhotoWrap")
    .innerHTML="";

  /*
    優先：
    1. 實體書去背照
    2. 封面
    3. placeholder
  */

  if(book.bookPhoto){

    const image=
      document.createElement(
        "img"
      );

    image.className=
      "detail-photo";

    image.src=
      book.bookPhoto;

    image.alt=
      book.title;

    $("detailPhotoWrap")
      .appendChild(image);

  }else if(book.cover){

    const fallback=
      document.createElement(
        "div"
      );

    fallback.className=
      "detail-fallback";

    const image=
      document.createElement(
        "img"
      );

    image.src=
      book.cover;

    image.alt=
      book.title;

    fallback.appendChild(
      image
    );

    $("detailPhotoWrap")
      .appendChild(
        fallback
      );

  }else{

    const fallback=
      document.createElement(
        "div"
      );

    fallback.className=
      "detail-fallback";

    const placeholder=
      document.createElement(
        "div"
      );

    placeholder.className=
      "cover-placeholder";

    placeholder.innerHTML=
      "<span>📖</span>";

    const title=
      document.createElement(
        "div"
      );

    title.textContent=
      book.title;

    placeholder.appendChild(
      title
    );

    fallback.appendChild(
      placeholder
    );

    $("detailPhotoWrap")
      .appendChild(
        fallback
      );
  }

  $("detailTitle")
    .textContent=
      book.title;

  $("detailCategory")
    .textContent=
      categoryNames[
        book.category
      ]||"其他";

  $("detailAge")
    .textContent=
      book.age||"不限";

  $("detailStatus")
    .textContent=
      book.readingStatus===
      "later"
        ?"長大再讀"
        :"現在適合";

  $("detailStatus")
    .classList.toggle(
      "now",
      book.readingStatus!==
      "later"
    );

  $("todayBookCount")
    .textContent=
      todayReads(book);

  $("totalBookCount")
    .textContent=
      totalReads(book);

  $("favoriteBtn")
    .textContent=
      book.favorite
        ?"♥ 已收藏"
        :"♡ 收藏";

  $("detailNote")
    .textContent=
      book.note||
      "還沒有筆記";

  $("readBtn")
    .textContent=
      "📖 完成一次共讀";

  $("readBtn")
    .classList.remove(
      "done"
    );
}

function openBook(id){

  const book=
    getBook(id);

  if(!book)return;

  selectedId=id;

  renderDetail(book);

  $("detailDialog")
    .showModal();
}

$("closeDetail")
  .onclick=()=>{

    $("detailDialog")
      .close();
  };

/* ==================================
   READ
================================== */

$("readBtn").onclick=()=>{

  if(readLocked)return;

  const book=
    getBook(selectedId);

  if(!book)return;

  readLocked=true;

  const record={
    id:makeId("read"),
    timestamp:Date.now(),
    dateKey:dayKey(),
    source:"manual"
  };

  book.readingHistory.push(
    record
  );

  lastReading={
    bookId:book.id,
    recordId:record.id
  };

  save();
  renderAll();
  renderDetail(book);

  $("readBtn")
    .textContent="✓ 已記錄";

  $("readBtn")
    .classList.add("done");

  showToast(
    "已記錄一次共讀",
    true
  );

  setTimeout(()=>{

    readLocked=false;

    if(
      selectedId===
      book.id
    ){

      $("readBtn")
        .textContent=
          "📖 再讀一次";

      $("readBtn")
        .classList.remove(
          "done"
        );
    }

  },1000);
};

/* ==================================
   UNDO
================================== */

$("undoBtn").onclick=()=>{

  if(!lastReading)return;

  const book=
    getBook(
      lastReading.bookId
    );

  if(book){

    book.readingHistory=
      book.readingHistory
        .filter(record=>
          record.id!==
          lastReading.recordId
        );

    save();
    renderAll();

    if(
      selectedId===
      book.id
    ){
      renderDetail(book);
    }
  }

  lastReading=null;

  hideToast();
};

/* ==================================
   FAVORITE
================================== */

$("favoriteBtn").onclick=()=>{

  const book=
    getBook(selectedId);

  if(!book)return;

  book.favorite=
    !book.favorite;

  save();
  renderAll();
  renderDetail(book);
};

/* ==================================
   HISTORY
================================== */

$("historyBtn").onclick=()=>{

  const book=
    getBook(selectedId);

  if(!book)return;

  $("historyBookName")
    .textContent=
      book.title;

  renderHistory(book);

  $("detailDialog")
    .close();

  $("historyDialog")
    .showModal();
};

function renderHistory(book){

  $("historyList")
    .innerHTML="";

  const history=[
    ...book.readingHistory
  ].reverse();

  if(!history.length){

    $("historyList")
      .innerHTML=
        '<div class="today-empty">還沒有共讀紀錄</div>';

    return;
  }

  history.forEach(record=>{

    const row=
      document.createElement(
        "div"
      );

    row.className=
      "history-row";

    const time=
      document.createElement(
        "div"
      );

    time.className=
      "history-time";

    time.textContent=
      formatTime(
        record.timestamp
      );

    const remove=
      document.createElement(
        "button"
      );

    remove.className=
      "history-delete";

    remove.textContent=
      "刪除";

    remove.onclick=()=>{

      if(
        !confirm(
          "刪除這次共讀紀錄？"
        )
      ){
        return;
      }

      book.readingHistory=
        book.readingHistory
          .filter(item=>
            item.id!==
            record.id
          );

      save();
      renderAll();
      renderHistory(book);
    };

    row.append(
      time,
      remove
    );

    $("historyList")
      .appendChild(row);
  });
}

$("closeHistory").onclick=()=>{

  $("historyDialog")
    .close();

  const book=
    getBook(selectedId);

  if(book){

    renderDetail(book);

    $("detailDialog")
      .showModal();
  }
};

/* ==================================
   PARENT MODE
================================== */

$("parentBtn").onclick=()=>{

  if(
    document.body
      .classList
      .contains("parent")
  ){

    document.body
      .classList
      .remove("parent");

    $("parentBtn")
      .textContent=
        "🔒 家長模式";

    return;
  }

  const pin=
    prompt("請輸入家長 PIN");

  if(pin===null)return;

  if(pin!==PIN){

    alert("PIN 不正確");

    return;
  }

  document.body
    .classList
    .add("parent");

  $("parentBtn")
    .textContent=
      "🔓 離開家長模式";
};

/* ==================================
   IMAGE COMPRESSION
================================== */

function compressImage(
  file,
  options={}
){

  const {
    maxWidth=900,
    maxHeight=1100,
    quality=.72,
    preservePNG=false
  }=options;

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=()=>{

        const image=
          new Image();

        image.onload=()=>{

          const scale=
            Math.min(
              1,
              maxWidth/
                image.width,
              maxHeight/
                image.height
            );

          const canvas=
            document.createElement(
              "canvas"
            );

          canvas.width=
            Math.round(
              image.width*scale
            );

          canvas.height=
            Math.round(
              image.height*scale
            );

          const ctx=
            canvas.getContext(
              "2d"
            );

          /*
            PNG 需要保留透明背景。
          */

          if(
            !preservePNG ||
            file.type!==
            "image/png"
          ){

            ctx.fillStyle="#fff";

            ctx.fillRect(
              0,
              0,
              canvas.width,
              canvas.height
            );
          }

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          if(
            preservePNG &&
            file.type===
            "image/png"
          ){

            resolve(
              canvas.toDataURL(
                "image/png"
              )
            );

          }else{

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                quality
              )
            );
          }
        };

        image.onerror=
          reject;

        image.src=
          reader.result;
      };

      reader.onerror=
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}

/* ==================================
   EDIT FORM
================================== */

function updatePreviews(){

  if(pendingCover){

    $("coverPreview").src=
      pendingCover;

    $("coverPreview")
      .style.display=
        "block";

  }else{

    $("coverPreview")
      .style.display=
        "none";
  }

  if(pendingBookPhoto){

    $("bookPhotoPreview").src=
      pendingBookPhoto;

    $("bookPhotoPreview")
      .style.display=
        "block";

  }else{

    $("bookPhotoPreview")
      .style.display=
        "none";
  }
}

function openForm(id=null){

  editingId=id;

  const book=
    id
      ?getBook(id)
      :null;

  $("formTitle")
    .textContent=
      book
        ?"編輯書籍"
        :"新增書籍";

  $("bookTitle").value=
    book?.title||"";

  $("bookCategory").value=
    book?.category||"story";

  $("bookAge").value=
    book?.age||"";

  $("bookStatus").value=
    book?.readingStatus||
    "now";

  $("bookNote").value=
    book?.note||"";

  pendingCover=
    book?.cover||"";

  pendingBookPhoto=
    book?.bookPhoto||"";

  $("coverFile").value="";
  $("bookPhotoFile").value="";

  $("coverResults")
    .innerHTML="";

  $("coverSearchMessage")
    .textContent="";

  updatePreviews();

  $("editDialog")
    .showModal();
}

$("addBookBtn").onclick=()=>{
  openForm();
};

$("editBtn").onclick=()=>{

  $("detailDialog")
    .close();

  openForm(selectedId);
};

$("cancelEdit").onclick=()=>{

  $("editDialog")
    .close();
};

/* ==================================
   COVER UPLOAD
================================== */

$("coverFile").onchange=
async function(){

  const file=
    this.files?.[0];

  if(!file)return;

  try{

    pendingCover=
      await compressImage(
        file,
        {
          maxWidth:650,
          maxHeight:900,
          quality:.68
        }
      );

    updatePreviews();

  }catch{

    alert(
      "封面照片讀取失敗"
    );
  }
};

/* ==================================
   BOOK PHOTO UPLOAD
================================== */

$("bookPhotoFile").onchange=
async function(){

  const file=
    this.files?.[0];

  if(!file)return;

  try{

    pendingBookPhoto=
      await compressImage(
        file,
        {
          maxWidth:900,
          maxHeight:1000,
          quality:.75,
          preservePNG:true
        }
      );

    updatePreviews();

  }catch{

    alert(
      "實體書照片讀取失敗"
    );
  }
};

/* ==================================
   OPEN LIBRARY COVER
================================== */

$("onlineCoverBtn").onclick=
async()=>{

  const title=
    $("bookTitle")
      .value
      .trim();

  if(!title){

    $("coverSearchMessage")
      .textContent=
        "請先輸入書名";

    return;
  }

  $("coverSearchMessage")
    .textContent=
      "搜尋中…";

  $("coverResults")
    .innerHTML="";

  try{

    const url=
      "https://openlibrary.org/search.json?title="+
      encodeURIComponent(title)+
      "&limit=12&fields=key,title,cover_i";

    const response=
      await fetch(url);

    if(!response.ok){
      throw new Error();
    }

    const data=
      await response.json();

    const results=
      (data.docs||[])
        .filter(item=>
          item.cover_i
        )
        .slice(0,6);

    if(!results.length){

      $("coverSearchMessage")
        .textContent=
          "沒有找到封面，建議直接上傳實際版本。";

      return;
    }

    $("coverSearchMessage")
      .textContent=
        "請確認是否為你手上的版本";

    results.forEach(item=>{

      const coverURL=
        `https://covers.openlibrary.org/b/id/${item.cover_i}-L.jpg`;

      const button=
        document.createElement(
          "button"
        );

      button.type="button";

      button.className=
        "cover-choice";

      const image=
        document.createElement(
          "img"
        );

      image.src=coverURL;

      button.appendChild(
        image
      );

      button.onclick=()=>{

        document
          .querySelectorAll(
            ".cover-choice"
          )
          .forEach(item=>
            item.classList
              .remove(
                "selected"
              )
          );

        button.classList.add(
          "selected"
        );

        pendingCover=
          coverURL;

        updatePreviews();
      };

      $("coverResults")
        .appendChild(
          button
        );
    });

  }catch{

    $("coverSearchMessage")
      .textContent=
        "目前無法搜尋，可以直接上傳封面。";
  }
};

/* ==================================
   SAVE BOOK
================================== */

$("bookForm").onsubmit=
event=>{

  event.preventDefault();

  const data={

    title:
      $("bookTitle")
        .value
        .trim(),

    category:
      $("bookCategory")
        .value,

    age:
      $("bookAge")
        .value
        .trim()||
      "不限",

    readingStatus:
      $("bookStatus")
        .value,

    note:
      $("bookNote")
        .value
        .trim(),

    cover:
      pendingCover,

    bookPhoto:
      pendingBookPhoto
  };

  if(editingId){

    const book=
      getBook(editingId);

    if(book){
      Object.assign(
        book,
        data
      );
    }

  }else{

    books.push({

      id:makeId("book"),

      ...data,

      favorite:false,

      readingHistory:[]
    });
  }

  if(save()){

    $("editDialog")
      .close();

    renderAll();
  }
};

/* ==================================
   DELETE
================================== */

$("deleteBtn").onclick=()=>{

  const book=
    getBook(selectedId);

  if(!book)return;

  if(
    !confirm(
      `確定刪除《${book.title}》？\n\n`+
      "封面、實體書照片、筆記與共讀紀錄都會一起刪除。"
    )
  ){
    return;
  }

  books=
    books.filter(
      item=>
        item.id!==book.id
    );

  selectedId=null;

  save();

  $("detailDialog")
    .close();

  renderAll();
};

/* ==================================
   BACKUP
================================== */

$("exportBtn").onclick=()=>{

  const backup={

    version:11,

    exportedAt:
      new Date()
        .toISOString(),

    books
  };

  const blob=
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const link=
    document.createElement(
      "a"
    );

  link.href=url;

  link.download=
    "Jessie-Library-backup.json";

  link.click();

  setTimeout(
    ()=>
      URL.revokeObjectURL(
        url
      ),
    1000
  );
};

$("importBtn").onclick=()=>{

  $("importFile")
    .click();
};

$("importFile").onchange=
function(){

  const file=
    this.files?.[0];

  if(!file)return;

  const reader=
    new FileReader();

  reader.onload=()=>{

    try{

      const parsed=
        JSON.parse(
          reader.result
        );

      const incoming=
        Array.isArray(parsed)
          ?parsed
          :parsed.books;

      if(
        !Array.isArray(
          incoming
        )
      ){
        throw new Error();
      }

      if(
        !confirm(
          "匯入備份會取代目前資料，確定嗎？"
        )
      ){
        return;
      }

      books=incoming;

      save();

      location.reload();

    }catch{

      alert(
        "這不是有效的 Jessie 圖書館備份"
      );
    }
  };

  reader.readAsText(file);
};

/* ==================================
   TOAST
================================== */

function showToast(
  text,
  undo=false
){

  clearTimeout(
    toastTimer
  );

  $("toastText")
    .textContent=text;

  $("undoBtn")
    .style.display=
      undo
        ?"block"
        :"none";

  $("toast")
    .classList
    .add("show");

  toastTimer=
    setTimeout(
      hideToast,
      7000
    );
}

function hideToast(){

  $("toast")
    .classList
    .remove("show");
}

/* ==================================
   RENDER
================================== */

function renderAll(){

  renderStats();
  renderToday();
  renderFilters();
  renderBooks();
}

load();
renderAll();

})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1">
<title>Jessie 的小圖書館</title>

<style>
:root{
  --bg:#fbf8f1;
  --paper:#fffdf9;
  --text:#4c3b30;
  --muted:#99897c;
  --line:#eadfd2;

  --wood1:#edd0a8;
  --wood2:#d9ae7d;
  --wood3:#b98151;

  --accent:#d8925e;
  --danger:#a85050;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 0,#fff 0,#fdfaf5 38%,var(--bg) 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}

button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
img{display:block}

/* =========================
   HEADER
========================= */

header{
  text-align:center;
  padding:calc(24px + env(safe-area-inset-top)) 18px 10px;
}

h1{
  margin:0;
  font-size:clamp(29px,8vw,40px);
  font-weight:950;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.stats{
  display:inline-flex;
  margin-top:12px;
  padding:8px 15px;
  border-radius:999px;
  background:#fff;
  border:1px solid #f0e7dc;
  box-shadow:0 5px 18px rgba(70,45,28,.05);
  font-size:13px;
}

/* =========================
   SEARCH
========================= */

.search-area{
  width:calc(100% - 30px);
  max-width:680px;
  margin:6px auto 14px;
}

.search-box{position:relative}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
}

#searchInput{
  width:100%;
  height:52px;
  padding:0 45px;
  border:1.5px solid #e8ddd0;
  border-radius:19px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-size:16px;
  box-shadow:0 4px 14px rgba(60,40,25,.04);
}

/* =========================
   TODAY
========================= */

.today-card{
  width:calc(100% - 30px);
  max-width:680px;
  margin:0 auto 22px;
  padding:14px;
  border:1.5px solid #ead8c3;
  border-radius:20px;
  background:rgba(255,255,255,.78);
}

.today-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
}

.today-total{
  padding:5px 9px;
  border-radius:999px;
  background:#f1e8de;
  font-size:12px;
}

.today-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:9px;
}

.today-row{
  display:flex;
  align-items:center;
  width:100%;
  padding:9px 10px;
  border:0;
  border-radius:13px;
  background:#fffaf4;
  color:var(--text);
  text-align:left;
}

.today-name{
  flex:1;
  min-width:0;
  margin-left:7px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.today-count{
  padding:4px 8px;
  border-radius:999px;
  background:#eee3d7;
  font-weight:900;
}

.empty{
  padding-top:8px;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   LIBRARY TITLE
========================= */

.library-title{
  width:calc(100% - 34px);
  max-width:680px;
  margin:0 auto 10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.library-title strong{
  font-size:21px;
}

.library-title span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   CABINET
========================= */

.library{
  width:calc(100% - 24px);
  max-width:680px;
  margin:auto;
  overflow:hidden;

  border-left:6px solid #d5aa7a;
  border-right:6px solid #d5aa7a;
  border-radius:15px 15px 10px 10px;

  background:
    linear-gradient(90deg,
      rgba(218,181,140,.09),
      rgba(255,255,255,.2) 15%,
      rgba(255,255,255,.2) 85%,
      rgba(218,181,140,.09)
    );

  box-shadow:0 8px 25px rgba(70,43,25,.07);
}

/* =========================
   CATEGORY
========================= */

.library-section{
  position:relative;
}

.section-header{
  display:flex;
  align-items:center;
  width:100%;
  min-height:49px;
  padding:9px 13px 3px;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
}

.section-icon{
  width:30px;
  font-size:19px;
}

.section-name{
  flex:1;
  font-size:17px;
  font-weight:950;
}

.section-count{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}

.section-arrow{
  margin-left:8px;
  color:#a98c73;
  font-size:20px;
}

/* =========================
   SHELF
========================= */

.spine-shelf{
  display:flex;
  align-items:flex-end;
  gap:5px;

  min-height:153px;
  padding:7px 13px 0;

  overflow-x:auto;
  overflow-y:hidden;

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.spine-shelf::-webkit-scrollbar{display:none}

/* =========================
   REAL BOOK
========================= */

.book-spine{
  position:relative;
  flex:0 0 auto;
  padding:0;
  border:0;
  overflow:hidden;
  transform-origin:center bottom;

  border-radius:4px 5px 2px 2px;

  box-shadow:
    inset 2px 0 3px rgba(0,0,0,.11),
    inset -2px 0 3px rgba(255,255,255,.25),
    2px 3px 5px rgba(65,40,23,.17);

  transition:.16s ease;
}

.book-spine:active{
  transform:translateY(-10px) scale(1.035) !important;
}

/* 封面露出的薄邊 */
.book-edge{
  position:absolute;
  right:0;
  top:3px;
  bottom:2px;
  width:3px;
  background:#f5eee3;
  opacity:.8;
}

/* 書背主體 */
.spine-design{
  position:absolute;
  inset:0 3px 0 0;
  overflow:hidden;
}

/* 上方小圖 */
.spine-icon{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  font-size:16px;
  z-index:3;
}

/* 中文書名 */
.spine-name{
  position:absolute;
  left:5px;
  right:5px;
  top:31px;
  bottom:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  writing-mode:vertical-rl;
  text-orientation:mixed;

  overflow:hidden;

  color:var(--spine-text,#fff);
  font-size:12px;
  font-weight:950;
  line-height:1.08;

  text-shadow:0 1px 1px rgba(0,0,0,.10);
}

/* 英文 */
.spine-name.english{
  writing-mode:horizontal-tb;

  left:50%;
  top:50%;
  right:auto;
  bottom:auto;

  width:120px;

  transform:translate(-50%,-50%) rotate(90deg);

  white-space:nowrap;
  text-align:center;
}

/* 裝飾圓 */
.spine-dot{
  position:absolute;
  border-radius:50%;
  opacity:.95;
}

/* Dear Zoo 小紅箱 */
.zoo-box{
  position:absolute;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);
  width:26px;
  height:20px;
  background:#d84b3d;
  border:2px solid #9c3028;
}

.zoo-box:before,
.zoo-box:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:#f3b34f;
}

.zoo-box:before{left:7px}
.zoo-box:after{right:7px}

/* Brown Bear */
.bear-shape{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  font-size:25px;
}

/* See Touch Feel */
.hand-print{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  font-size:22px;
}

/* 交通 */
.vehicle{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  font-size:23px;
}

/* 0歲系列 */
.zero-mark{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:16px;
  font-weight:950;
  color:white;
}

/* 愛心 */
.favorite-heart{
  position:absolute;
  right:4px;
  top:5px;
  z-index:4;
  font-size:9px;
}

/* =========================
   WOOD
========================= */

.wood-shelf{
  position:relative;
  height:17px;

  background:
    linear-gradient(
      to bottom,
      #f0d0a7 0%,
      #ddb382 48%,
      #c9915d 100%
    );

  border-top:1px solid rgba(255,255,255,.7);
  border-bottom:4px solid #aa7447;

  box-shadow:0 5px 7px rgba(70,42,21,.15);
}

/* =========================
   CATEGORY VIEW
========================= */

#categoryView{display:none}

.category-top{
  width:calc(100% - 30px);
  max-width:680px;
  margin:0 auto 16px;
}

.back-btn{
  min-height:44px;
  padding:0 15px;
  border:0;
  border-radius:999px;
  background:white;
  color:var(--text);
  font-weight:850;
  box-shadow:0 4px 13px rgba(0,0,0,.06);
}

.category-title{
  margin:18px 2px 4px;
  font-size:27px;
}

.category-description{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   COVERS
========================= */

.cover-grid{
  width:calc(100% - 30px);
  max-width:680px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px 15px;
}

.cover-card{
  min-width:0;
  padding:0;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
}

.book-cover{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:5px 11px 9px 4px;
  background:#eee5d8;

  box-shadow:
    7px 10px 17px rgba(55,33,19,.18);
}

.book-cover:before{
  content:"";
  position:absolute;
  z-index:3;
  left:0;
  top:0;
  bottom:0;
  width:6px;
  background:linear-gradient(90deg,rgba(40,20,7,.20),transparent);
}

.book-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.fake-cover{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:15px;
  background:#e7a071;
  color:white;
  text-align:center;
  font-weight:900;
}

.fake-cover b{
  margin-bottom:12px;
  font-size:30px;
}

.cover-name{
  margin-top:9px;
  font-size:13px;
  font-weight:900;
  line-height:1.35;
}

.cover-meta{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.cover-tag{
  padding:5px 8px;
  border-radius:999px;
  background:#f1eae2;
  color:#78695e;
  font-size:11px;
}

/* =========================
   PARENT
========================= */

.parent-tools{
  display:none;
  width:calc(100% - 30px);
  max-width:680px;
  margin:18px auto;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

body.parent .parent-tools{display:grid}

.parent-tools button{
  min-width:0;
  min-height:49px;
  padding:7px;
  border:0;
  border-radius:15px;
  background:white;
  color:var(--text);
  font-size:12px;
  font-weight:850;
  box-shadow:0 4px 13px rgba(0,0,0,.06);
}

/* =========================
   DIALOG
========================= */

dialog{
  width:min(92vw,440px);
  max-height:92dvh;
  margin:auto;
  padding:0;
  overflow:auto;

  border:3px solid #cfaa7c;
  border-radius:27px;

  background:var(--paper);
  color:var(--text);

  box-shadow:0 25px 80px rgba(0,0,0,.38);
}

dialog::backdrop{
  background:rgba(55,45,37,.63);
  backdrop-filter:blur(4px);
}

.modal{padding:18px}

.close{
  position:sticky;
  top:0;
  z-index:30;

  display:grid;
  place-items:center;

  width:46px;
  height:46px;
  margin-left:auto;

  border:0;
  border-radius:50%;
  background:#f0e8df;
  color:var(--text);
  font-size:24px;
}

/* =========================
   DETAIL
========================= */

.detail-cover{
  width:min(55vw,215px);
  aspect-ratio:3/4;
  margin:-25px auto 18px;
  overflow:hidden;

  border-radius:6px 14px 11px 4px;
  background:#eee5d8;

  box-shadow:10px 15px 22px rgba(50,30,17,.22);
}

.detail-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-title{
  margin:10px 0;
  text-align:center;
  font-size:24px;
}

.tags{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  padding:7px 10px;
  border-radius:999px;
  background:#f1e9e0;
  font-size:13px;
  font-weight:800;
}

.read-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.read-stat{
  padding:11px;
  border-radius:16px;
  background:#f7f1ea;
  text-align:center;
}

.read-stat strong{
  display:block;
  font-size:25px;
}

.read-stat span{
  color:var(--muted);
  font-size:12px;
}

.read-btn{
  width:100%;
  min-height:61px;
  margin-top:11px;

  border:0;
  border-radius:21px;

  background:linear-gradient(135deg,#eda16b,#dc875e);
  color:white;

  font-size:19px;
  font-weight:950;
}

.read-btn.recorded{
  background:#9aaa8f;
}

.favorite-btn,
.history-btn{
  width:100%;
  min-height:50px;
  margin-top:8px;
  border-radius:17px;
  font-weight:900;
}

.favorite-btn{
  border:2.5px solid #cda779;
  background:white;
  color:var(--text);
}

.history-btn{
  border:0;
  background:#f1ebe4;
  color:var(--text);
}

.note{
  display:none;
  margin-top:14px;
  padding:14px;
  border:2px dashed #dda777;
  border-radius:17px;
  background:#fff9f1;
  line-height:1.5;
}

body.parent .note{display:block}

.parent-actions{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

body.parent .parent-actions{display:grid}

.parent-actions button{
  min-height:48px;
  border:0;
  border-radius:15px;
  font-weight:900;
}

.edit-btn{background:#eee;color:#555}
.delete-btn{background:#ffe4e4;color:var(--danger)}

/* =========================
   HISTORY
========================= */

.history-list{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:12px;
}

.history-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border-radius:14px;
  background:#f7f1ea;
}

.history-time{
  flex:1;
  font-size:14px;
}

.history-delete{
  padding:7px 10px;
  border:0;
  border-radius:10px;
  background:#ffe4e4;
  color:var(--danger);
  font-weight:850;
}

/* =========================
   FORM
========================= */

label{
  display:block;
  margin:12px 2px 5px;
  font-size:13px;
  font-weight:900;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd1c4;
  border-radius:13px;
  outline:none;
  background:white;
  color:var(--text);
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.help{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.cover-preview{
  display:none;
  width:120px;
  height:160px;
  margin:12px auto;
  object-fit:cover;
  border-radius:7px;
  box-shadow:5px 8px 14px rgba(0,0,0,.17);
}

.cover-search-btn{
  width:100%;
  min-height:47px;
  margin-top:7px;
  border:0;
  border-radius:14px;
  background:#efe7dd;
  color:var(--text);
  font-weight:900;
}

.cover-results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.cover-choice{
  min-width:0;
  padding:0;
  overflow:hidden;
  border:3px solid transparent;
  border-radius:9px;
  background:#eee;
}

.cover-choice.selected{border-color:#d89a74}

.cover-choice img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
}

.search-message{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:17px;
}

.form-actions button{
  min-height:49px;
  border:0;
  border-radius:14px;
  font-weight:900;
}

.cancel-btn{background:#eee}
.save-btn{background:var(--accent);color:white}

/* =========================
   BOTTOM NAV
========================= */

.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;

  display:flex;
  justify-content:center;

  padding:22px 12px calc(12px + env(safe-area-inset-bottom));

  background:linear-gradient(transparent,var(--bg) 38%);
  pointer-events:none;
}

#parentBtn{
  pointer-events:auto;
  min-height:52px;
  padding:0 22px;

  border:1px solid #eee4d9;
  border-radius:999px;

  background:white;
  color:var(--text);

  font-weight:900;

  box-shadow:0 7px 22px rgba(0,0,0,.11);
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:calc(95px + env(safe-area-inset-bottom));
  z-index:300;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  width:calc(100% - 28px);
  max-width:410px;

  padding:12px 14px;
  border-radius:18px;

  background:#493d35;
  color:white;

  opacity:0;
  transform:translate(-50%,40px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
  pointer-events:auto;
}

.toast button{
  padding:7px 11px;
  border:0;
  border-radius:999px;
  background:white;
  color:var(--text);
  font-weight:900;
}

@media(min-width:600px){
  .cover-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 Jessie 的小圖書館</h1>
  <div class="subtitle">閱讀，陪你長大的每一天 ♡</div>
  <div class="stats" id="stats"></div>
</header>

<section class="search-area">
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input id="searchInput" type="search" placeholder="搜尋 Jessie 的書……">
  </div>
</section>

<section class="today-card">
  <div class="today-head">
    <span>☀️ 今天的共讀</span>
    <span class="today-total" id="todayTotal">0 次</span>
  </div>
  <div id="todayContent"></div>
</section>

<main id="libraryHome">

  <div class="library-title">
    <strong>Jessie Library</strong>
    <span>點書脊抽一本書 ♡</span>
  </div>

  <div class="library" id="library"></div>

</main>

<main id="categoryView">

  <section class="category-top">

    <button class="back-btn" id="backBtn">
      ← 回圖書館
    </button>

    <h2 class="category-title" id="categoryTitle"></h2>

    <div class="category-description" id="categoryDescription"></div>

  </section>

  <div class="cover-grid" id="coverGrid"></div>

</main>

<section class="parent-tools">

  <button id="addBookBtn">＋ 新增書籍</button>
  <button id="exportBtn">⇩ 匯出備份</button>
  <button id="importBtn">⇧ 匯入備份</button>

  <input id="importFile" type="file" accept="application/json" hidden>

</section>

<div class="bottom-bar">
  <button id="parentBtn">🔒 家長模式</button>
</div>

<!-- DETAIL -->

<dialog id="detailDialog">
<div class="modal">

  <button class="close" id="closeDetail">×</button>

  <div class="detail-cover" id="detailCover"></div>

  <h2 class="detail-title" id="detailTitle"></h2>

  <div class="tags">
    <span class="tag" id="detailCategory"></span>
    <span class="tag" id="detailAge"></span>
    <span class="tag" id="detailStatus"></span>
  </div>

  <div class="read-stats">

<script>
(()=>{
"use strict";

/* ===============================
   CONFIG
================================ */

const STORAGE_KEY="jessie-bookshelf-v5";
const PIN="1234";

const categories=[
  {
    id:"story",
    name:"故事繪本",
    icon:"📖",
    description:"故事、角色與情節"
  },
  {
    id:"english",
    name:"英文繪本",
    icon:"🔤",
    description:"英文共讀與語感"
  },
  {
    id:"sensory",
    name:"感官・互動",
    icon:"✋",
    description:"觸摸、翻翻與互動"
  },
  {
    id:"readalong",
    name:"點讀・有聲",
    icon:"🔊",
    description:"KidsRead、點讀與聲音互動"
  },
  {
    id:"cognitive",
    name:"認知探索",
    icon:"🧠",
    description:"找一找、生活與認知"
  },
  {
    id:"music",
    name:"兒歌・音樂",
    icon:"🎵",
    description:"兒歌、音樂與唱遊"
  },
  {
    id:"other",
    name:"其他",
    icon:"📚",
    description:"其他收藏"
  }
];

let books=[];
let selectedId=null;
let editingId=null;
let pendingCover="";
let lastReading=null;
let toastTimer=null;
let readLocked=false;

const $=id=>document.getElementById(id);

/* ===============================
   ID / HELPERS
================================ */

function makeId(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function getBook(id){
  return books.find(book=>book.id===id);
}

function categoryInfo(id){
  return categories.find(c=>c.id===id)||categories.at(-1);
}

function dayKey(timestamp=Date.now()){
  const d=new Date(timestamp);

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function totalReads(book){
  return (book.readingHistory||[]).length;
}

function todayReads(book){
  const today=dayKey();

  return (book.readingHistory||[])
    .filter(record=>{
      if(record.dateKey){
        return record.dateKey===today;
      }

      return record.timestamp &&
        dayKey(record.timestamp)===today;
    })
    .length;
}

function formatTime(timestamp){
  if(!timestamp)return "舊版共讀紀錄";

  const d=new Date(timestamp);

  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

/* ===============================
   STORAGE
================================ */

function load(){

  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    books=raw?JSON.parse(raw):[];

    if(!Array.isArray(books)){
      books=[];
    }

  }catch{
    books=[];
  }

  books.forEach(book=>{

    if(!book.id){
      book.id=makeId("book");
    }

    if(!book.category){
      book.category="other";
    }

    if(!book.readingStatus){
      book.readingStatus="now";
    }

    if(typeof book.favorite!=="boolean"){
      book.favorite=false;
    }

    if(typeof book.spineTitle!=="string"){
      book.spineTitle="";
    }

    if(!Array.isArray(book.readingHistory)){

      book.readingHistory=[];

      const old=Number(book.readCount)||0;

      for(let i=0;i<old;i++){
        book.readingHistory.push({
          id:makeId("legacy"),
          timestamp:null,
          legacy:true
        });
      }

    }

    book.readingHistory.forEach(record=>{
      if(!record.id){
        record.id=makeId("read");
      }
    });

  });

  save();
}

function save(){

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(books)
    );

    return true;

  }catch{

    alert(
      "Safari 儲存空間不足。\n\n建議先匯出備份。"
    );

    return false;
  }

}

/* ===============================
   BOOK VISUAL IDENTITY
================================ */

/*
  這裡是新版核心。

  不是隨機莫蘭迪色，
  而是辨識書名後給它
  接近原書的書脊語言。
*/

function normalizeTitle(book){
  return (book.title||"").toLowerCase();
}

function bookVisual(book){

  const title=normalizeTitle(book);

  /* See Touch Feel */
  if(
    title.includes("see") &&
    title.includes("touch") &&
    title.includes("feel")
  ){
    return{
      background:"#fffaf4",
      secondary:"#ef3d74",
      text:"#4b4038",
      icon:"🖐️",
      type:"touch"
    };
  }

  /* Brown Bear */
  if(title.includes("brown bear")){
    return{
      background:"#f7f1e6",
      secondary:"#a85c2c",
      text:"#46372e",
      icon:"🐻",
      type:"bear"
    };
  }

  /* Dear Zoo */
  if(title.includes("dear zoo")){
    return{
      background:"#f6e6a8",
      secondary:"#d8493c",
      text:"#3d342c",
      icon:"",
      type:"zoo"
    };
  }

  /* 小藍和小黃 */
  if(
    title.includes("小藍") &&
    title.includes("小黃")
  ){
    return{
      background:"#fffaf3",
      secondary:"#2684c6",
      text:"#39332d",
      icon:"",
      type:"blueyellow"
    };
  }

  /* 交通聲音 */
  if(
    title.includes("交通") ||
    title.includes("什麼聲音")
  ){
    return{
      background:"#a8d8e8",
      secondary:"#e64b35",
      text:"#33444a",
      icon:"🚒",
      type:"vehicle"
    };
  }

  /* 0歲 book */
  if(
    title.includes("0歲") ||
    title.includes("0 歲")
  ){
    return{
      background:"#7dbb37",
      secondary:"#f26522",
      text:"#ffffff",
      icon:"",
      type:"zero"
    };
  }

  /* 小寶貝愛唱歌 */
  if(title.includes("愛唱歌")){
    return{
      background:"#3d7f87",
      secondary:"#efc757",
      text:"#ffffff",
      icon:"♪",
      type:"music"
    };
  }

  /* 小黃點 */
  if(
    title.includes("小黃點") ||
    title.includes("yellow dot")
  ){
    return{
      background:"#fffaf4",
      secondary:"#f2c928",
      text:"#39342f",
      icon:"",
      type:"dots"
    };
  }

  /* KidsRead */
  if(
    title.includes("kidsread") ||
    title.includes("手指") ||
    title.includes("互動圖典")
  ){
    return{
      background:"#fff8ed",
      secondary:"#e55f62",
      text:"#493b32",
      icon:"☝️",
      type:"kidsread"
    };
  }

  /*
    沒辨識到：
    依分類給溫和底色
  */

  const defaults={
    story:{
      background:"#e7c1b5",
      secondary:"#c57b69",
      text:"#4a3930"
    },
    english:{
      background:"#aac5ce",
      secondary:"#668e9c",
      text:"#34454b"
    },
    sensory:{
      background:"#e6bdc5",
      secondary:"#cb7e91",
      text:"#4c393e"
    },
    readalong:{
      background:"#c3d0b4",
      secondary:"#839772",
      text:"#394134"
    },
    cognitive:{
      background:"#e4c782",
      secondary:"#c59d4c",
      text:"#463c2c"
    },
    music:{
      background:"#c1afc7",
      secondary:"#927c9a",
      text:"#403743"
    },
    other:{
      background:"#cdb9a7",
      secondary:"#9f8068",
      text:"#43372f"
    }
  };

  return{
    ...(defaults[book.category]||defaults.other),
    icon:"📖",
    type:"default"
  };
}

/* ===============================
   SPINE TITLE
================================ */

function getSpineTitle(book){

  if(book.spineTitle?.trim()){
    return book.spineTitle.trim();
  }

  const title=book.title||"";
  const lower=title.toLowerCase();

  if(lower.includes("brown bear")){
    return "Brown Bear";
  }

  if(lower.includes("see, touch, feel")){
    return "See, Touch, Feel";
  }

  if(lower.includes("這是什麼聲音")){
    return "交通聲音";
  }

  if(lower.includes("手指點讀")){
    return "KidsRead";
  }

  return title;
}

function mostlyEnglish(text){

  const english=(text.match(/[A-Za-z]/g)||[]).length;
  const chinese=(text.match(/[\u3400-\u9fff]/g)||[]).length;

  return english>chinese;
}

/* ===============================
   SPINE SIZE
================================ */

function bookSeed(book){

  return [...(book.id||book.title||"")]
    .reduce((sum,char)=>sum+char.charCodeAt(0),0);
}

function spineSize(book){

  const seed=bookSeed(book);

  /*
    厚紙板童書稍微偏厚，
    但每本仍有差異
  */

  return{
    width:42+(seed%4)*6,
    height:112+(seed%6)*6,
    tilt:((seed%5)-2)*0.18
  };
}

/* ===============================
   CREATE SPINE
================================ */

function createSpine(book){

  const visual=bookVisual(book);
  const size=spineSize(book);

  const button=document.createElement("button");

  button.className="book-spine";

  button.style.width=size.width+"px";
  button.style.height=size.height+"px";
  button.style.transform=`rotate(${size.tilt}deg)`;

  button.style.setProperty("--spine-text",visual.text);

  const design=document.createElement("div");
  design.className="spine-design";
  design.style.background=visual.background;

  /*
    書脊上方副色
  */
  const topBand=document.createElement("div");

  topBand.style.position="absolute";
  topBand.style.left="0";
  topBand.style.right="0";
  topBand.style.top="0";
  topBand.style.height="7px";
  topBand.style.background=visual.secondary;

  design.appendChild(topBand);

  /*
    特殊書籍圖形
  */

  if(visual.type==="blueyellow"){

    const blue=document.createElement("span");
    blue.className="spine-dot";
    blue.style.width="25px";
    blue.style.height="25px";
    blue.style.background="#2486c7";
    blue.style.left="-6px";
    blue.style.bottom="15px";

    const yellow=document.createElement("span");
    yellow.className="spine-dot";
    yellow.style.width="25px";
    yellow.style.height="25px";
    yellow.style.background="#f4d426";
    yellow.style.right="-6px";
    yellow.style.bottom="15px";

    design.append(blue,yellow);

  }else if(visual.type==="zoo"){

    const box=document.createElement("span");
    box.className="zoo-box";

    design.appendChild(box);

  }else if(visual.type==="bear"){

    const bear=document.createElement("span");
    bear.className="bear-shape";
    bear.textContent="🐻";

    design.appendChild(bear);

  }else if(visual.type==="touch"){

    const hand=document.createElement("span");
    hand.className="hand-print";
    hand.textContent="🖐️";

    design.appendChild(hand);

  }else if(visual.type==="vehicle"){

    const vehicle=document.createElement("span");
    vehicle.className="vehicle";
    vehicle.textContent="🚒";

    design.appendChild(vehicle);

  }else if(visual.type==="zero"){

    const zero=document.createElement("span");
    zero.className="zero-mark";
    zero.textContent="0歲";

    design.appendChild(zero);

  }else if(visual.type==="dots"){

    ["#e94745","#f2d02f","#2786c4"].forEach((color,index)=>{

      const dot=document.createElement("span");
      dot.className="spine-dot";

      dot.style.width="18px";
      dot.style.height="18px";
      dot.style.background=color;
      dot.style.bottom=(8+index*14)+"px";
      dot.style.left=(index%2?5:20)+"px";

      design.appendChild(dot);

    });

  }else if(visual.icon){

    const icon=document.createElement("span");
    icon.className="spine-icon";
    icon.textContent=visual.icon;

    design.appendChild(icon);
  }

  /*
    書名
  */

  const name=document.createElement("span");

  name.className="spine-name";

  const shortTitle=getSpineTitle(book);

  name.textContent=shortTitle;

  if(mostlyEnglish(shortTitle)){
    name.classList.add("english");
  }

  design.appendChild(name);

  /*
    頁面薄邊
  */

  const edge=document.createElement("span");
  edge.className="book-edge";

  button.append(design,edge);

  if(book.favorite){

    const heart=document.createElement("span");
    heart.className="favorite-heart";
    heart.textContent="♥";

    button.appendChild(heart);
  }

  button.onclick=()=>openBook(book.id);

  return button;
}

/* ===============================
   STATS
================================ */

function renderStats(){

  const total=books.reduce(
    (sum,book)=>sum+totalReads(book),
    0
  );

  $("stats").textContent=
    `${books.length} 本藏書 · 累積共讀 ${total} 次`;
}

/* ===============================
   TODAY
================================ */

function renderToday(){

  $("todayContent").innerHTML="";

  const items=books
    .map(book=>({
      book,
      count:todayReads(book)
    }))
    .filter(item=>item.count>0);

  const total=items.reduce(
    (sum,item)=>sum+item.count,
    0
  );

  $("todayTotal").textContent=`${total} 次`;

  if(!items.length){

    const empty=document.createElement("div");

    empty.className="empty";
    empty.textContent="今天還沒有共讀，從書架挑一本吧 ♡";

    $("todayContent").appendChild(empty);

    return;
  }

  const list=document.createElement("div");
  list.className="today-list";

  items.forEach(({book,count})=>{

    const row=document.createElement("button");
    row.className="today-row";

    const icon=document.createElement("span");
    icon.textContent="📖";

    const name=document.createElement("span");
    name.className="today-name";
    name.textContent=book.title;

    const amount=document.createElement("span");
    amount.className="today-count";
    amount.textContent=`× ${count}`;

    row.append(icon,name,amount);

    row.onclick=()=>openBook(book.id);

    list.appendChild(row);
  });

  $("todayContent").appendChild(list);
}

/* ===============================
   LIBRARY
================================ */

function makeShelf(category,list){

  if(!list.length)return null;

  const section=document.createElement("section");
  section.className="library-section";

  const header=document.createElement("button");
  header.className="section-header";

  const icon=document.createElement("span");
  icon.className="section-icon";
  icon.textContent=category.icon;

  const name=document.createElement("span");
  name.className="section-name";
  name.textContent=category.name;

  const count=document.createElement("span");
  count.className="section-count";
  count.textContent=`${list.length} 本`;

  const arrow=document.createElement("span");
  arrow.className="section-arrow";
  arrow.textContent="›";

  header.append(icon,name,count,arrow);

  header.onclick=()=>showCategory(category.id);

  const shelf=document.createElement("div");
  shelf.className="spine-shelf";

  list.forEach(book=>{
    shelf.appendChild(createSpine(book));
  });

  const wood=document.createElement("div");
  wood.className="wood-shelf";

  section.append(header,shelf,wood);

  return section;
}

function renderLibrary(){

  $("library").innerHTML="";

  categories.forEach(category=>{

    const list=books.filter(book=>
      book.category===category.id &&
      book.readingStatus!=="later"
    );

    const section=makeShelf(category,list);

    if(section){
      $("library").appendChild(section);
    }
  });

  const later=books.filter(book=>book.readingStatus==="later");

  if(later.length){

    const category={
      id:"later",
      name:"長大再讀",
      icon:"🌿"
    };

    const section=makeShelf(category,later);

    if(section){
      $("library").appendChild(section);
    }
  }
}

/* ===============================
   COVER
================================ */

function createCover(book){

  const button=document.createElement("button");
  button.className="cover-card";

  const cover=document.createElement("div");
  cover.className="book-cover";

  if(book.cover){

    const img=document.createElement("img");

    img.src=book.cover;
    img.alt=book.title;

    cover.appendChild(img);

  }else{

    const fake=document.createElement("div");
    fake.className="fake-cover";

    const icon=document.createElement("b");
    icon.textContent="📖";

    const title=document.createElement("span");
    title.textContent=book.title;

    fake.append(icon,title);

    cover.appendChild(fake);
  }

  const name=document.createElement("div");
  name.className="cover-name";
  name.textContent=book.title;

  const meta=document.createElement("div");
  meta.className="cover-meta";

  const age=document.createElement("span");
  age.className="cover-tag";
  age.textContent=book.age||"不限";

  const status=document.createElement("span");
  status.className="cover-tag";

  status.textContent=
    book.readingStatus==="later"
      ?"🌿 長大再讀"
      :"🌱 現在適合";

  meta.append(age,status);

  button.append(cover,name,meta);

  button.onclick=()=>openBook(book.id);

  return button;
}

/* ===============================
   CATEGORY
================================ */

function showCategory(categoryId,custom=null,titleOverride=null){

  let list=[];
  let title="";
  let description="";

  if(custom){

    list=custom;
    title=titleOverride||"搜尋結果";

  }else if(categoryId==="later"){

    list=books.filter(book=>book.readingStatus==="later");

    title="🌿 長大再讀";
    description="先收藏起來，等 Jessie 再大一點探索";

  }else{

    const info=categoryInfo(categoryId);

    list=books.filter(book=>
      book.category===categoryId &&
      book.readingStatus!=="later"
    );

    title=`${info.icon} ${info.name}`;
    description=info.description;
  }

  $("libraryHome").style.display="none";
  $("categoryView").style.display="block";

  $("categoryTitle").textContent=title;

  $("categoryDescription").textContent=
    `${description}${description?" · ":""}${list.length} 本`;

  $("coverGrid").innerHTML="";

  list.forEach(book=>{
    $("coverGrid").appendChild(createCover(book));
  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

$("backBtn").onclick=()=>{

  $("categoryView").style.display="none";
  $("libraryHome").style.display="block";

  $("searchInput").value="";
};

/* ===============================
   SEARCH
================================ */

$("searchInput").addEventListener("input",event=>{

  const raw=event.target.value.trim();
  const keyword=raw.toLowerCase();

  if(!keyword){

    $("categoryView").style.display="none";
    $("libraryHome").style.display="block";

    return;
  }

  const result=books.filter(book=>
    (book.title||"").toLowerCase().includes(keyword) ||
    (book.spineTitle||"").toLowerCase().includes(keyword) ||
    (book.note||"").toLowerCase().includes(keyword)
  );

  showCategory(null,result,`🔎「${raw}」`);
});

/* ===============================
   DETAIL
================================ */

function renderDetail(book){

  $("detailCover").innerHTML="";

  if(book.cover){

    const img=document.createElement("img");

    img.src=book.cover;
    img.alt=book.title;

    $("detailCover").appendChild(img);

  }else{

    const fake=document.createElement("div");

    fake.className="fake-cover";

    const icon=document.createElement("b");
    icon.textContent="📖";

    const title=document.createElement("span");
    title.textContent=book.title;

    fake.append(icon,title);

    $("detailCover").appendChild(fake);
  }

  const category=categoryInfo(book.category);

  $("detailTitle").textContent=book.title;
  $("detailCategory").textContent=category.name;
  $("detailAge").textContent=book.age||"不限";

  $("detailStatus").textContent=
    book.readingStatus==="later"
      ?"🌿 長大再讀"
      :"🌱 現在適合";

  $("todayBookCount").textContent=todayReads(book);
  $("totalBookCount").textContent=totalReads(book);

  $("favoriteBtn").textContent=
    book.favorite
      ?"♥ Jessie 的最愛"
      :"♡ 加入最愛";

  $("detailNote").textContent=
    book.note||"還沒有備註";

  $("readBtn").textContent="📖 完成一次共讀";
  $("readBtn").classList.remove("recorded");
}

function openBook(id){

  const book=getBook(id);

  if(!book)return;

  selectedId=id;

  renderDetail(book);

  $("detailDialog").showModal();
}

$("closeDetail").onclick=()=>{
  $("detailDialog").close();
};

/* ===============================
   READ
================================ */

$("readBtn").onclick=()=>{

  if(readLocked)return;

  readLocked=true;

  const book=getBook(selectedId);

  if(!book){
    readLocked=false;
    return;
  }

  const record={
    id:makeId("read"),
    timestamp:Date.now(),
    dateKey:dayKey(),
    source:"manual"
  };

  book.readingHistory.push(record);

  lastReading={
    bookId:book.id,
    recordId:record.id
  };

  save();
  renderAll();
  renderDetail(book);

  $("readBtn").textContent="✓ 已記錄";
  $("readBtn").classList.add("recorded");

  showToast("✓ 已記錄一次共讀",true);

  setTimeout(()=>{

    readLocked=false;

    if(selectedId===book.id){
      $("readBtn").textContent="📖 再讀一次";
      $("readBtn").classList.remove("recorded");
    }

  },1200);
};

/* ===============================
   UNDO
================================ */

$("undoBtn").onclick=()=>{

  if(!lastReading)return;

  const book=getBook(lastReading.bookId);

  if(book){

    book.readingHistory=
      book.readingHistory.filter(record=>
        record.id!==lastReading.recordId
      );

    save();
    renderAll();

    if(selectedId===book.id){
      renderDetail(book);
    }
  }

  lastReading=null;
  hideToast();
};

/* ===============================
   FAVORITE
================================ */

$("favoriteBtn").onclick=()=>{

  const book=getBook(selectedId);

  if(!book)return;

  book.favorite=!book.favorite;

  save();
  renderAll();
  renderDetail(book);
};

/* ===============================
   HISTORY
================================ */

$("historyBtn").onclick=()=>{

  const book=getBook(selectedId);

  if(!book)return;

  $("historyBookName").textContent=book.title;

  renderHistory(book);

  $("detailDialog").close();
  $("historyDialog").showModal();
};

function renderHistory(book){

  $("historyList").innerHTML="";

  const history=[...book.readingHistory].reverse();

  if(!history.length){

    $("historyList").innerHTML=
      '<div class="empty">還沒有共讀紀錄。</div>';

    return;
  }

  history.forEach(record=>{

    const row=document.createElement("div");
    row.className="history-row";

    const time=document.createElement("div");
    time.className="history-time";

    time.textContent="📖 "+formatTime(record.timestamp);

    const remove=document.createElement("button");
    remove.className="history-delete";
    remove.textContent="刪除";

    remove.onclick=()=>{

      if(!confirm("確定刪除這一次共讀紀錄嗎？"))return;

      book.readingHistory=
        book.readingHistory.filter(item=>
          item.id!==record.id
        );

      save();
      renderAll();
      renderHistory(book);
    };

    row.append(time,remove);

    $("historyList").appendChild(row);
  });
}

$("closeHistory").onclick=()=>{

  $("historyDialog").close();

  const book=getBook(selectedId);

  if(book){
    renderDetail(book);
    $("detailDialog").showModal();
  }
};

/* ===============================
   PARENT MODE
================================ */

$("parentBtn").onclick=()=>{

  if(document.body.classList.contains("parent")){

    document.body.classList.remove("parent");

    $("parentBtn").textContent="🔒 家長模式";

    return;
  }

  const pin=prompt("請輸入家長 PIN");

  if(pin===null)return;

  if(pin!==PIN){

    alert("PIN 不正確");

    return;
  }

  document.body.classList.add("parent");

  $("parentBtn").textContent="🔓 離開家長模式";
};

/* ===============================
   EDIT FORM
================================ */

function openForm(id=null){

  editingId=id;

  const book=id?getBook(id):null;

  $("formTitle").textContent=
    book?"編輯書籍":"新增書籍";

  $("bookTitle").value=book?.title||"";
  $("bookSpineTitle").value=book?.spineTitle||"";
  $("bookCategory").value=book?.category||"story";
  $("bookAge").value=book?.age||"";
  $("bookStatus").value=book?.readingStatus||"now";
  $("bookNote").value=book?.note||"";

  pendingCover=book?.cover||"";

  $("coverFile").value="";
  $("coverResults").innerHTML="";
  $("coverSearchMessage").textContent="";

  updateCoverPreview();

  $("editDialog").showModal();
}

$("addBookBtn").onclick=()=>openForm();

$("editBtn").onclick=()=>{

  $("detailDialog").close();

  openForm(selectedId);
};

$("cancelEdit").onclick=()=>{
  $("editDialog").close();
};

function updateCoverPreview(){

  if(pendingCover){

    $("coverPreview").src=pendingCover;
    $("coverPreview").style.display="block";

  }else{

    $("coverPreview").style.display="none";
  }
}

/* ===============================
   ONLINE COVER
================================ */

$("onlineCoverBtn").onclick=async()=>{

  const title=$("bookTitle").value.trim();

  if(!title){

    $("coverSearchMessage").textContent="請先輸入書名。";

    return;
  }

  $("coverSearchMessage").textContent="正在尋找可能的封面……";
  $("coverResults").innerHTML="";

  try{

    const url=
      "https://openlibrary.org/search.json?title="+
      encodeURIComponent(title)+
      "&limit=12&fields=key,title,author_name,cover_i,isbn";

    const response=await fetch(url);

    if(!response.ok)throw new Error();

    const data=await response.json();

    const results=(data.docs||[])
      .filter(item=>item.cover_i)
      .slice(0,6);

    if(!results.length){

      $("coverSearchMessage").textContent=
        "沒有找到適合的封面。中文版建議直接上傳實際封面。";

      return;
    }

    $("coverSearchMessage").textContent=
      "請確認是不是你家裡實際的版本：";

    results.forEach(item=>{

      const url=
        `https://covers.openlibrary.org/b/id/${item.cover_i}-L.jpg`;

      const button=document.createElement("button");

      button.type="button";
      button.className="cover-choice";

      const image=document.createElement("img");

      image.src=url;
      image.alt=item.title||title;

      button.appendChild(image);

      button.onclick=()=>{

        document.querySelectorAll(".cover-choice")
          .forEach(item=>item.classList.remove("selected"));

        button.classList.add("selected");

        pendingCover=url;

        updateCoverPreview();
      };

      $("coverResults").appendChild(button);
    });

  }catch{

    $("coverSearchMessage").textContent=
      "目前無法連線搜尋封面，可以改用手機照片。";
  }
};

/* ===============================
   LOCAL COVER
================================ */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{

      const image=new Image();

      image.onload=()=>{

        const scale=Math.min(
          1,
          650/image.width,
          900/image.height
        );

        const canvas=document.createElement("canvas");

        canvas.width=Math.round(image.width*scale);
        canvas.height=Math.round(image.height*scale);

        const ctx=canvas.getContext("2d");

        ctx.fillStyle="#fff";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL("image/jpeg",.68)
        );
      };

      image.onerror=reject;
      image.src=reader.result;
    };

    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

$("coverFile").onchange=async function(){

  const file=this.files?.[0];

  if(!file)return;

  try{

    pendingCover=await compressImage(file);

    updateCoverPreview();

  }catch{

    alert("封面照片讀取失敗。");
  }
};

/* ===============================
   SAVE BOOK
================================ */

$("bookForm").onsubmit=event=>{

  event.preventDefault();

  const data={

    title:$("bookTitle").value.trim(),

    spineTitle:$("bookSpineTitle").value.trim(),

    category:$("bookCategory").value,

    age:$("bookAge").value.trim()||"不限",

    readingStatus:$("bookStatus").value,

    note:$("bookNote").value.trim(),

    cover:pendingCover
  };

  if(editingId){

    const book=getBook(editingId);

    if(book){
      Object.assign(book,data);
    }

  }else{

    books.push({

      id:makeId("book"),

      ...data,

      favorite:false,

      readingHistory:[]
    });
  }

  if(save()){

    $("editDialog").close();

    renderAll();
  }
};

/* ===============================
   DELETE
================================ */

$("deleteBtn").onclick=()=>{

  const book=getBook(selectedId);

  if(!book)return;

  if(!confirm(
    `確定刪除《${book.title}》嗎？\n\n封面、筆記與共讀紀錄都會一起刪除。`
  ))return;

  books=books.filter(item=>item.id!==book.id);

  selectedId=null;

  save();

  $("detailDialog").close();

  renderAll();
};

/* ===============================
   BACKUP
================================ */

$("exportBtn").onclick=()=>{

  const backup={
    version:10,
    exportedAt:new Date().toISOString(),
    books
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const link=document.createElement("a");

  link.href=url;
  link.download="Jessie-Library-backup.json";

  link.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("importBtn").onclick=()=>{
  $("importFile").click();
};

$("importFile").onchange=function(){

  const file=this.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const parsed=JSON.parse(reader.result);

      const incoming=
        Array.isArray(parsed)
          ?parsed
          :parsed.books;

      if(!Array.isArray(incoming)){
        throw new Error();
      }

      if(!confirm("匯入備份會取代目前書櫃，確定嗎？")){
        return;
      }

      books=incoming;

      save();

      location.reload();

    }catch{

      alert("這不是有效的 Jessie 書櫃備份。");
    }
  };

  reader.readAsText(file);
};

/* ===============================
   TOAST
================================ */

function showToast(text,undo=false){

  clearTimeout(toastTimer);

  $("toastText").textContent=text;

  $("undoBtn").style.display=
    undo?"block":"none";

  $("toast").classList.add("show");

  toastTimer=setTimeout(
    hideToast,
    8000
  );
}

function hideToast(){
  $("toast").classList.remove("show");
}

/* ===============================
   RENDER
================================ */

function renderAll(){
  renderStats();
  renderToday();
  renderLibrary();
}

load();
renderAll();

})();
</script>
